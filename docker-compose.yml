services:
  elasticsearch-1:
    image: ted-elasticsearch:8.15.0
    hostname: elasticsearch-1
    container_name: elasticsearch-1
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    build:
      context: ./elasticsearch
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"
    environment:
      cluster.name: "elastic"
      node.name: "elasticsearch-1"
      network.host: "${HOST1_IP}"
      transport.host: "${HOST1_IP}"
      http.port: "${ES1_HTTP_PORT}"
      transport.port: "${ES1_TR_PORT}"
      node.roles: master,data,ingest,remote_cluster_client
      discovery.seed_hosts: ${HOST1_IP}:${ES1_TR_PORT},${HOST2_IP}:${ES2_TR_PORT}
      cluster.initial_master_nodes: elasticsearch-1,elasticsearch-2
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false
    volumes:
      - ${DATA_PATH}/elasticsearch-1:/usr/share/elasticsearch/data
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1
  elasticsearch-2:
    image: ted-elasticsearch:8.15.0
    hostname: elasticsearch-2
    container_name: elasticsearch-2
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    build:
      context: ./elasticsearch
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    network_mode: "host"
    environment:
      cluster.name: "elastic"
      node.name: "elasticsearch-2"
      network.host: "${HOST2_IP}"
      transport.host: "${HOST2_IP}"
      http.port: "${ES2_HTTP_PORT}"
      transport.port: "${ES2_TR_PORT}"
      node.roles: master,data,ingest,remote_cluster_client
      discovery.seed_hosts: ${HOST1_IP}:${ES1_TR_PORT},${HOST2_IP}:${ES2_TR_PORT}
      cluster.initial_master_nodes: elasticsearch-1,elasticsearch-2
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false
    volumes:
      - ${DATA_PATH}/elasticsearch-2:/usr/share/elasticsearch/data
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1
############################################################################################################
  kibana:
    image: kibana:8.15.0
    hostname: kibana
    container_name: kibana
    restart: unless-stopped
    network_mode: "host"
    environment:
      SERVER_HOST: ${HOST1_IP}
      SERVER_PORT: ${KI_HTTP_PORT}
      INTERACTIVE_SETUP_ENABLED: false
      ELASTICSEARCH_HOSTS: "http://${HOST1_IP}:${ES1_HTTP_PORT}"
      ELASTICSEARCH_SSL_VERIFICATIONMODE: none
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1
#################################################################################################################
  geaservice:
    image: ted-geaservice:1.0.0
    hostname: geaservice
    container_name: geaservice
    command: app/geaservice
    restart: unless-stopped
    build:
      context: ./geaservice
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    network_mode: "host"
    environment:
      HOST_IP: "${HOST1_IP}"
      GS01_PORT: "${GS_HTTP_PORT}"
      SITE: "${SITE}"
    volumes:
      - ./geaservice/:/geaservice/
      - /etc/localtime:/etc/localtime
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1
#################################################################################################################
  ngrok:
    image: ngrok/ngrok
    container_name: ngrok
    network_mode: "host"
    command: http 3000 --url=ted.ngrok.dev
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    restart: unless-stopped

  grafana:
    image: ted-grafana:12.0.0
    hostname: grafana
    container_name: grafana
    restart: unless-stopped
    build:
      context: ./grafana
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    network_mode: "host"
    environment:
      HOST_IP: "${HOST1_IP}"
      SITE: "${SITE}"
      GR_HTTP_PORT: "${GR_HTTP_PORT}"
      ES_API_IP: "${ES_API_IP}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GF_AUTH_API_KEY_ENABLED: true
      # GF_RENDERING_SERVER_URL: "http://${HOST01_IP}:8081/render"
      # GF_RENDERING_CALLBACK_URL: "http://${HOST01_IP}:8080/"
      # GF_LOG_FILTERS: "rendering:debug"
    volumes:
      - ./grafana/grafana-data/plugins:/var/lib/grafana/plugins
      - ./grafana/conf/:/etc/grafana/
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1
#################################################################################################################
  renderer:
    image: grafana/grafana-image-renderer:3.11.3
    hostname: renderer
    container_name: gr01-render
    restart: unless-stopped
    network_mode: "host" 
    volumes:
      - ./gr01/render/config.json:/usr/src/app/config.json
#################################################################################################################
  softioc:
    image: jeffersonlab/softioc:1.1.0
    tty: true
    environment:
      - EPICS_CA_AUTO_ADDR_LIST=NO
      - EPICS_CA_ADDR_LIST=127.0.0.1
    stdin_open: true
    hostname: softioc
    container_name: softioc
    volumes:
      - ./softioc/data/softioc.db:/db/softioc.db
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
#################################################################################################################
  archappl:
    container_name: "${APPLIANCE_NAME}"
    hostname: "${APPLIANCE_NAME}"
    mem_limit: 6G
    build:
      context: ./archappl
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    image: gear-appliance:1.1.0
    network_mode: "host"
    volumes:
      - ./archappl/conf:/etc/archappl/
      - ./archappl/webapps:/usr/local/tomcat/webapps
      - ${APPLIANCE_STS}:/storage/sts
      - ${APPLIANCE_LTS}:/storage/lts
      - ${APPLIANCE_LOGS}:/storage/logs
    stdin_open: true
    tty: true
    environment:
      MYSQL_CONNECTION_STRING: "--user=${MYSQL_USER} --password=${MYSQL_PASSWORD} --database=${MYSQL_DATABASE} --host=${MYSQL_HOST}"
      ARCHAPPL_MYIDENTITY: ${APPLIANCE_NAME}
      EPICS_CA_AUTO_ADDR_LIST: ${CA_AUTO_ADDR_LIST}
      EPICS_CA_ADDR_LIST: ${CA_ADDR_LIST}
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "python3 /usr/local/tomcat/bin/addMysqlConnPool.py && /usr/local/tomcat/bin/catalina.sh run"
  mysql:
    container_name: ${MYSQL_NAME}
    hostname: ${MYSQL_NAME}
    build:
      context: ./mysql
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    image: gear-mysql:8.0.35-debian
    volumes:
      - ${MYSQL_DATA}:/var/lib/mysql
    network_mode: "host"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
  aaservice:
    container_name: aaservice
    hostname: "aaservice"
    build:
      context: ./aaservice
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    image: aaservice:0.1
    environment:
      EPICS_CA_AUTO_ADDR_LIST: ${CA_AUTO_ADDR_LIST}
      EPICS_CA_ADDR_LIST: ${CA_ADDR_LIST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_HOST: ${MYSQL_HOST}
    command: uvicorn aaservice:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./aaservice:/aaservice/
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"
