version: '3.8'
services:
#######################################################################################################

  elasticsearch:
    image: ted-elasticsearch:8.15.0
    hostname: elasticsearch
    container_name: es01
    restart: unless-stopped

    build:
      context: ./es01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    volumes:
      - ./es01/config:/usr/share/elasticsearch/config
      - ./es01/logs:/usr/share/elasticsearch/logs
      - ${DATA_PATH}/es01:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://172.17.71.25:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

############################################################################################################

  elasticsearch-2:
    image: ted-elasticsearch:8.15.0
    hostname: elasticsearch-2
    container_name: es02
    restart: unless-stopped

    build:
      context: ./es02
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    volumes:
      - ./es02/config:/usr/share/elasticsearch/config
      - ./es02/logs:/usr/share/elasticsearch/logs
      - ${DATA_PATH}/es02:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://172.17.71.27:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

############################################################################################################

  kibana:
    image: kibana:8.15.0
    hostname: kibana
    container_name: ki01
    restart: unless-stopped

    network_mode: "host"

    environment:
      INTERACTIVESETUP_ENABLED: false
      ELASTICSEARCH_HOSTS: "http://172.17.71.27:${ES01_PORT}"
      elasticsearch.ssl.verificationMode: "none"

    depends_on:
          elasticsearch:
            condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  logstash:
    image: ted-logstash:8.15.0
    hostname: logstash
    container_name: ls01
    restart: unless-stopped

    build:
      context: ./ls01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      LOGSTASH_MODE: tail
      HOST_1: "172.17.71.27:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - ./ls01/config:/usr/share/logstash/config
      - ./ls01/pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/usr/logs/log
      - ${DATA_PATH}/ls01/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  logstash-daily:
    image: ted-logstash:8.15.0
    hostname: logstash-daily
    container_name: ls03
    restart: unless-stopped

    build:
      context: ./ls03
      dockerfile: Dockerfile
      args:
