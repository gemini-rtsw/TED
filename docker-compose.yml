      - ${LOGS_PATH}:/usr/logs/log
      - ${DATA_PATH}/ls03/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################
  
  logstash-4:
