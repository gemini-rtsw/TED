version: '3.8'
services:
#######################################################################################################

  elasticsearch:
    image: ted-elasticsearch:8.15.0
    hostname: elasticsearch
    container_name: es01
    restart: unless-stopped

    build:
      context: ./es01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"

    volumes:
      - ./es01/config:/usr/share/elasticsearch/config
      - ./es01/logs:/usr/share/elasticsearch/logs
      - ${DATA_PATH}/es01:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${HOST01_IP}:${ES01_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

############################################################################################################

  kibana:
    image: kibana:8.15.0
    hostname: kibana
    container_name: ki01
    restart: unless-stopped

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      INTERACTIVESETUP_ENABLED: false
      ELASTICSEARCH_HOSTS: "http://${HOST01_IP}:${ES01_PORT}"
      elasticsearch.ssl.verificationMode: "none"
      SERVER_PORT: "${KI01_PORT}"

    depends_on:
          elasticsearch:
            condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  logstash:
    image: ted-logstash:8.15.0
    hostname: logstash
    container_name: ls01
    restart: unless-stopped

    build:
      context: ./ls01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      LOGSTASH_MODE: tail
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - ./ls01/config:/usr/share/logstash/config
      - ./ls01/pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls01/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  logstash-daily:
    image: ted-logstash:8.15.0
    hostname: logstash-daily
    container_name: ls03
    restart: unless-stopped

    build:
      context: ./ls03
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      LOGSTASH_MODE: tail
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - ./ls03/config:/usr/share/logstash/config
      - ./ls03/pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/gemsoft/var/log
      - ${DATA_PATH}/ls03/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  geaservice:
    image: ted-geaservice:1.0.0
    hostname: geaservice
    container_name: geaservice
    command: app/geaservice
    restart: unless-stopped

    build:
      context: ./geaservice
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      GS01_PORT: "${GS01_PORT}"

    volumes:
      - ./geaservice/:/geaservice/
      - /etc/localtime:/etc/localtime


    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  grafana:
    image: ted-grafana:11.1.4-ubuntu
    hostname: grafana
    container_name: gr01
    restart: unless-stopped

    build:
      context: ./gr01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      GR01_PORT: "${GR01_PORT}"
      HOST_IP: "${HOST01_IP}"
      GF_RENDERING_SERVER_URL: "http://${HOST01_IP}:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://${HOST01_IP}:8080/"
      GF_LOG_FILTERS: "rendering:debug"

    volumes:
      - ./gr01/grafana-data:/var/lib/grafana
      - ./gr01/conf/grafana.ini:/etc/grafana/grafana.ini

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  renderer:
    image: grafana/grafana-image-renderer:3.11.3
    hostname: renderer
    container_name: gr01-render
    restart: unless-stopped
    network_mode: "host" 
    volumes:
      - ./gr01/render/config.json:/usr/src/app/config.json

#################################################################################################################
