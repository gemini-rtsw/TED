version: '3.8'
services:
#######################################################################################################

  elasticsearch:
    image: ted-elasticsearch:8.15.0
    hostname: elasticsearch
    container_name: es01
    restart: unless-stopped

    build:
      context: ./elasticsearch/es01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"

    volumes:
      - ./elasticsearch/es01/config:/usr/share/elasticsearch/config
      - ./elasticsearch/es01/logs:/usr/share/elasticsearch/logs
      - ${DATA_PATH}/es01:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${HOST01_IP}:${ES01_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

############################################################################################################

  kibana:
    image: kibana:8.15.0
    hostname: kibana
    container_name: ki01
    restart: unless-stopped

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      INTERACTIVESETUP_ENABLED: false
      ELASTICSEARCH_HOSTS: "http://${HOST01_IP}:${ES01_PORT}"
      elasticsearch.ssl.verificationMode: "none"
      SERVER_PORT: "${KI01_PORT}"

    depends_on:
          elasticsearch:
            condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  ls-core:
    image: ted-logstash:8.15.0
    hostname: logstash
    container_name: ls-core
    restart: unless-stopped

    build:
      context: "./logstash/${SITE}/ls-core"
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./logstash/${SITE}/ls-core/config:/usr/share/logstash/config"
      - "./logstash/${SITE}/ls-core/pipeline:/usr/share/logstash/pipeline"
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls-core/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  ls-wfs:
    image: ted-logstash:8.15.0
    container_name: ls-wfs
    restart: unless-stopped

    build:
      context: "./logstash/${SITE}/ls-wfs"
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./logstash/${SITE}/ls-wfs/config:/usr/share/logstash/config"
      - "./logstash/${SITE}/ls-wfs/pipeline:/usr/share/logstash/pipeline"
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls-wfs/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  geaservice:
    image: ted-geaservice:1.0.0
    hostname: geaservice
    container_name: geaservice
    command: app/geaservice
    restart: unless-stopped

    build:
      context: ./geaservice
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      GS01_PORT: "${GS01_PORT}"
      SITE: "${SITE}"

    volumes:
      - ./geaservice/:/geaservice/
      - /etc/localtime:/etc/localtime


    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  grafana:
    image: ted-grafana:11.1.4-ubuntu
    hostname: grafana
    container_name: grafana
    restart: unless-stopped

    build:
      context: ./grafana
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      GR01_PORT: "${GR01_PORT}"
      HOST_IP: "${HOST01_IP}"
        #      GF_RENDERING_SERVER_URL: "http://${HOST01_IP}:8081/render"
        #      GF_RENDERING_CALLBACK_URL: "http://${HOST01_IP}:8080/"
        #GF_LOG_FILTERS: "rendering:debug"

    volumes:
      - ./grafana/grafana-data:/var/lib/grafana
      - ./grafana/conf/grafana.ini:/etc/grafana/grafana.ini

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  renderer:
    image: grafana/grafana-image-renderer:3.11.3
    hostname: renderer
    container_name: gr01-render
    restart: unless-stopped
    network_mode: "host" 
    volumes:
      - ./gr01/render/config.json:/usr/src/app/config.json

#################################################################################################################
