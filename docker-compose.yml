version: '3.7'
services:
  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: "es01"
    restart: unless-stopped
    user: "${U_ID}:${G_ID}"
    networks:
    - "elkg"
    volumes: [
      ./es01/config:/usr/share/elasticsearch/config,
      ./es01/logs:/usr/share/elasticsearch/logs,
      "${DATA_PATH}/es01:/usr/share/elasticsearch/data"
    ]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"

  kibana:
    image: kibana:8.11.1
    container_name: ki01
    restart: unless-stopped
    networks:
    - "elkg"
    ports:
    - "${KI01_PORT}:5601"
    environment:
      INTERACTIVESETUP_ENABLED: false
      ELASTICSEARCH_HOSTS: http://elasticsearch:${ES01_PORT}
      elasticsearch.ssl.verificationMode: "none"
    depends_on:
      - elasticsearch
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"

  logstash_01:
    image: logstash:8.11.1
    container_name: "ls01"
    restart: unless-stopped
    user: "1000:${G_ID}"
    networks:
    - "elkg"
    environment:
      LOGSTASH_MODE: tail
      HOST_1: http://elasticsearch:${ES01_PORT}
      TIMEZONE: "${LS_TIMEZONE}"
    volumes:
      - ./ls01/config:/usr/share/logstash/config
      - ./ls01/pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/usr/logs/log
      - ${DATA_PATH}/ls01/db:/db
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"

  logstash_02:
    image: logstash:8.11.1
    container_name: "ls02"
    restart: unless-stopped
    user: "1000:${G_ID}"
    networks:
    - "elkg"
    environment:
      LOGSTASH_MODE: read
      HOST_1: http://elasticsearch:${ES01_PORT}
      TIMEZONE: "${LS_TIMEZONE}"
      DAY: "${DAY}"
      MONTH: "${MONTH}"
      YEAR: "${YEAR}"
    volumes:
      - ./ls02/config:/usr/share/logstash/config
      - ./ls02/pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/usr/logs/log
      - ${DATA_PATH}/ls02/db:/db
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"

  geaservice:
      build: ./geaservice
      container_name: geaservice
      command: python3 /geaservice/geaservice.py
      restart: unless-stopped
      networks:
        - "elkg"
      ports:
        - "${GS01_PORT}:8000"
      volumes:
        - ./geaservice/:/geaservice/
      logging:
        driver: "json-file"
        options:
          max-size: "100m"
          max-file: "1"

  grafana:
      image: grafana/grafana:10.2.1-ubuntu
      container_name: "gr01"
      restart: unless-stopped
      user: "${U_ID}:${G_ID}"
      networks:
      - "elkg"
      ports:
      - "${GR01_PORT}:3000"
      environment:
        GF_RENDERING_SERVER_URL: http://renderer:8081/render
        GF_RENDERING_CALLBACK_URL: http://grafana:3000/
        GF_LOG_FILTERS: rendering:debug
      volumes:
        - ./gr01/grafana-data:/var/lib/grafana
        - ./gr01/conf:/usr/share/grafana/conf
      logging:
        driver: "json-file"
        options:
          max-size: "100m"
          max-file: "1"

  renderer:
      image: grafana/grafana-image-renderer:3.8.4
      container_name: "gr01-render"
      restart: unless-stopped
      networks:
      - "elkg"

networks:
  elkg:
    driver: bridge
    external: true
