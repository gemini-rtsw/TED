      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################
  logstash-5:
    image: ted-logstash:8.15.0
    hostname: logstash-5
    container_name: ls05
    restart: unless-stopped

    build:
      context: ./ls05
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      LOGSTASH_MODE: tail
      HOST_1: "172.17.71.25:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - ./ls05/config:/usr/share/logstash/config
      - ./ls05/pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/usr/logs/log
      - ${DATA_PATH}/ls05/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  geaservice:
    image: ted-geaservice:1.0.0
    hostname: geaservice
    container_name: geaservice
    command: app/geaservice
    restart: unless-stopped

    build:
      context: ./geaservice
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    volumes:
      - ./geaservice/:/geaservice/
      - /etc/localtime:/etc/localtime


    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  grafana:
    image: ted-grafana:11.1.4-ubuntu
    hostname: grafana
    container_name: gr01
    restart: unless-stopped

    build:
      context: ./gr01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      GF_RENDERING_SERVER_URL: "http://172.17.71.25:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://172.17.71.25:3000/"
      GF_LOG_FILTERS: "rendering:debug"

    volumes:
      - ./gr01/grafana-data:/var/lib/grafana
      - ./gr01/conf/grafana.ini:/etc/grafana/grafana.ini

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  renderer:
    image: grafana/grafana-image-renderer:3.11.3
    hostname: renderer
    container_name: gr01-render
    restart: unless-stopped
    network_mode: "host" 
    volumes:
      - ./gr01/render/config.json:/usr/src/app/config.json

#################################################################################################################
