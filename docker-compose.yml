services:
#######################################################################################################

  elasticsearch:
    image: ted-elasticsearch:8.15.0
    hostname: elasticsearch
    container_name: es01
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    build:
      context: ./elasticsearch/es01
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"

    volumes:
      - ./elasticsearch/es01/config:/usr/share/elasticsearch/config
      - ./elasticsearch/es01/logs:/usr/share/elasticsearch/logs
      - ${DATA_PATH}/es01:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${HOST01_IP}:${ES01_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

############################################################################################################

  kibana:
    image: kibana:8.15.0
    hostname: kibana
    container_name: ki01
    restart: unless-stopped

    cpus: 1.0
    mem_limit: 1g

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      INTERACTIVESETUP_ENABLED: false
      ELASTICSEARCH_HOSTS: "http://${HOST01_IP}:${ES01_PORT}"
      elasticsearch.ssl.verificationMode: "none"
      SERVER_PORT: "${KI01_PORT}"

    depends_on:
          elasticsearch:
            condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  ls-core:
    image: ted-logstash:8.15.0
    hostname: logstash
    container_name: ls-core
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    build:
      context: "./logstash/${SITE}/ls-core"
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./logstash/${SITE}/ls-core/config:/usr/share/logstash/config"
      - "./logstash/${SITE}/ls-core/pipeline:/usr/share/logstash/pipeline"
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls-core/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################

  ls-guiders:
    image: ted-logstash:8.15.0
    container_name: ls-guiders
    restart: unless-stopped

    cpus: 1.0
    mem_limit: 1g

    build:
      context: "./logstash/${SITE}/ls-guiders"
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./logstash/${SITE}/ls-guiders/config:/usr/share/logstash/config"
      - "./logstash/${SITE}/ls-guiders/pipeline:/usr/share/logstash/pipeline"
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls-guiders/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

#################################################################################################################


  ls-opstools:
    image: ted-logstash:8.15.0
    container_name: ls-opstools
    restart: unless-stopped

    cpus: 1.0
    mem_limit: 1g
    build:
      context: "."
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./logstash/${SITE}/ls-opstools/config:/usr/share/logstash/config"
      - "./logstash/${SITE}/ls-opstools/pipeline:/usr/share/logstash/pipeline"
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls-opstools/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  geaservice:
    image: ted-geaservice:1.0.0
    hostname: geaservice
    container_name: geaservice
    command: app/geaservice
    restart: unless-stopped

    build:
      context: ./geaservice
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      HOST_IP: "${HOST01_IP}"
      GS01_PORT: "${GS01_PORT}"
      SITE: "${SITE}"

    volumes:
      - ./geaservice/:/geaservice/
      - /etc/localtime:/etc/localtime


    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  grafana:
    image: ted-grafana:12.0.0
    hostname: grafana
    container_name: grafana
    restart: unless-stopped

    build:
      context: ./grafana
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: "host"

    environment:
      GR01_PORT: "${GR01_PORT}"
      HOST_IP: "${HOST01_IP}"
        #      GF_RENDERING_SERVER_URL: "http://${HOST01_IP}:8081/render"
        #      GF_RENDERING_CALLBACK_URL: "http://${HOST01_IP}:8080/"
        #GF_LOG_FILTERS: "rendering:debug"

    volumes:
      - ./grafana/grafana-data/plugins:/var/lib/grafana/plugins
      - ./grafana/conf/:/etc/grafana/

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


#################################################################################################################

  renderer:
    image: grafana/grafana-image-renderer:3.11.3
    hostname: renderer
    container_name: gr01-render
    restart: unless-stopped
    network_mode: "host" 
    volumes:
      - ./gr01/render/config.json:/usr/src/app/config.json

#################################################################################################################

  softioc:
    image: jeffersonlab/softioc:1.1.0
    tty: true
    environment:
      - EPICS_CA_AUTO_ADDR_LIST=NO
      - EPICS_CA_ADDR_LIST=127.0.0.1
    stdin_open: true
    hostname: softioc
    container_name: softioc
    volumes:
      - ./softioc/data/softioc.db:/db/softioc.db
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

#################################################################################################################


  mysql:
    container_name: ${MYSQL_NAME}
    hostname: ${MYSQL_NAME}
    build:
      context: ./mysql
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    image: gear-mysql:8.0.35-debian
    volumes:
      - ${MYSQL_DATA}:/var/lib/mysql
    network_mode: "host"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
  
  archappl:
    container_name: "${APPLIANCE_NAME}"
    hostname: "${APPLIANCE_NAME}"
    build:
      context: ./archappl
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    image: gear-appliance:1.1.0
    volumes:
      - ./archappl/conf:/etc/archappl/
      - ./archappl/webapps:/usr/local/tomcat/webapps
      - ${APPLIANCE_STS}:/storage/sts
      - ${APPLIANCE_LTS}:/storage/lts
      - ${APPLIANCE_LOGS}:/storage/logs
    stdin_open: true
    tty: true
    environment:
      MYSQL_CONNECTION_STRING: "--user=archappl --password=archappl --database=archappl --host=${MYSQL_NAME}"
      ARCHAPPL_MYIDENTITY: ${APPLIANCE_NAME}
      EPICS_CA_AUTO_ADDR_LIST: ${CA_AUTO_ADDR_LIST}
      EPICS_CA_ADDR_LIST: ${CA_ADDR_LIST}
    depends_on:
      mysql:
        condition: service_healthy
    network_mode: "host"
    command: sh -c "python3 /usr/local/tomcat/bin/addMysqlConnPool.py && /usr/local/tomcat/bin/catalina.sh run"
