MCS:
  Elevation:
    General:
      Position:
        codes:
          - mc:elCurrentPos
      Error:
        codes:
          - mc:elPosError
      Velocity:
        codes:
          - mc:elCurrentVel
      TCS Demand:
        codes:
          - mc:elDemandPos
      InPos Flag:
        codes:
          - mc:inPositionEl
      State:
        codes:
          - mc:elStateS
      Command:
        codes:
          - mc:elCommandS
      Drive Condition:
        codes:
          - mc:elDriveCondition          
    Virtual Encoders (degrees):
      FDE:
        codes:
          - mc:elengToDeg.VALB
      Tape Head 1:
        codes:
          - mc:elengToDeg.VALC
      Tape Head 2:
        codes:
          - mc:elengToDeg.VALD
      Virtual Encoder:
        codes:
          - mc:elengToDeg.VALA
    PMAC Data:
      General:
        Demand Position:
          codes:
            - mc:elPmacDemandPos
        Error:
          codes:
            - mc:elPmacPosError
      Status Words:
        All:
          codes:
            - "mc:elmotstat1:2:"
            - mc:elmotstat1:2:OLM.MLST
            - "mc:elmotstat2:2:"
            - mc:elmotstat2:2:IP
        Elevation (Open Loop Mode):
          codes:
            - mc:elmotstat1:2:OLM.MLST  
      Motors:
        Motor 1:
          codes:
            - mc:elMotor1
        Motor 2:
          codes:
            - mc:elMotor2
        Motor 3:
          codes:
            - mc:elMotor3
        Motor 4:
          codes:
              - mc:elMotor4
      Tachos:
        Tacho 1:
          codes:
            - mc:elTacho1
        Tacho 2:
          codes:
            - mc:elTacho2
        Tacho 3:
          codes:
            - mc:elTacho3
        Tacho 4:
          codes:
            - mc:elTacho4
  Azimuth:
    General:
      Position:
        codes:
          - mc:azCurrentPos
      Error:
        codes:
          - mc:azPosError
      Velocity:
        codes:
          - mc:azCurrentVel
      TCS Demand:
        codes:
          - mc:azDemandPos
      InPos Flag:
        codes:
          - mc:inPositionAz
      State:
        codes:
          - mc:azStateS
      Command:
        codes:
          - mc:azCommandS
      Drive Condition:
        codes:
          - mc:azDriveCondition    
    Virtual Encoders (degrees):
      FDE:
        codes:
          - mc:azengToDeg.VALB
      Tape Head 1:
        codes:
          - mc:azengToDeg.VALC
      Tape Head 2:
        codes:
          - mc:azengToDeg.VALD
      Tape Head 3:
        codes:
          - mc:azengToDeg.VALE
      Tape Head 4:
        codes:
          - mc:azengToDeg.VALF
      Virtual Encoder:
        codes:
          - mc:azengToDeg.VALA
    PMAC Data:
      General:
        Demand Position:
          codes:
            - mc:azPmacDemandPos
        Error:
          codes:
            - mc:azPmacPosError
      Status Words:
        All:       
          codes:
            - "mc:azmotstat1:2:"
            - mc:azmotstat1:2:DVZ
            - "mc:azmotstat2:2:"
            - mc:azmotstat1:2:OLM.MLST
        Open Loop Mode:
          codes:
            - mc:azmotstat1:2:OLM.MLST
      Motors:
        Motor 1:
          codes:
            - mc:azMotor1
        Motor 2:
          codes:
            - mc:azMotor2
        Motor 3:
          codes:
            - mc:azMotor3
        Motor 4:
          codes:
            - mc:azMotor4
        Motor 5:
          codes:
            - mc:azMotor5
        Motor 6:
          codes:
            - mc:azMotor6
        Motor 7:
          codes:
            - mc:azMotor7
        Motor 8:
          codes:
            - mc:azMotor8
      Tachos:
        Tacho 1:
          codes:
            - mc:azTacho1
        Tacho 2:
          codes:
            - mc:azTacho2
        Tacho 3:
          codes:
            - mc:azTacho3
        Tacho 4:
          codes:
            - mc:azTacho4
        Tacho 5:
          codes:
            - mc:azTacho5
        Tacho 6:
          codes:
            - mc:azTacho6
        Tacho 7:
          codes:
            - mc:azTacho7
        Tacho 8:
          codes:
            - mc:azTacho8
  Network:
    TCS-MCS Network Delay:
      codes:
        - mc:Tracking.VALH
  