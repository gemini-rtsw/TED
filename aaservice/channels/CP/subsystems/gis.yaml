  Azimuth Wrap information:
    Current Motor 1 (amps):
      codes:
        - gis:mon:azwrap:amp1
    Current Motor 2 (amps):
      codes:
        - gis:mon:azwrap:amp2
    LVDT Voltage (volts):
      codes:
        - gis:mon:azwrap:lvdt
    Power supply Voltage (volts):
      codes:
        - gis:mon:azwrap:powsupply
  Elevation Wrap +X information:
