GIS:
  PAZ Bearings Pressure (bars):
    G1 (+X-Y):
      Vertical:
        codes:
          - gis:mon:azmon2:vrbpG1c
      Radial:
        codes:
          - gis:mon:azmon2:rabpG1c
    G2 (-X-Y):
      Vertical:
        codes:
          - gis:mon:azmon2:vrbpG2c
      Radial:
        codes:
          - gis:mon:azmon2:rabpG2c
    G3 (+X+Y):
      Vertical:
        codes:
          - gis:mon:azmon2:vrbpG3c
      Radial:
        codes:
          - gis:mon:azmon2:rabpG3c
    G4 (-X+Y):
      Vertical:
        codes:
          - gis:mon:azmon2:vrbpG4c
      Radial:
        codes:
          - gis:mon:azmon2:rabpG4c
    G5 (+X):
      Vertical:
        codes:
          - gis:mon:azmon2:vrbpG5c
      Radial:
        codes:
          - gis:mon:azmon2:rabpG5c
    G6 (-X):
      Vertical:
        codes:
          - gis:mon:azmon2:vrbpG6c
      Radial:
        codes:
          - gis:mon:azmon2:rabpG6c
  ALT Bearings Pressure (bars):
    H1 (-X):
      Axial(861):
        codes:
          - gis:mon:altmon2:bpH1861c
      Radial(862):
        codes:
          - gis:mon:altmon2:bpH1862c
      Radial(863):
        codes:
          - gis:mon:altmon2:bpH1863c
    H2 (+X):
      Axial(861):
        codes:
          - gis:mon:altmon2:bpH2861c
      Radial(862):
        codes:
          - gis:mon:altmon2:bpH2862c
      Radial(863):
        codes:
          - gis:mon:altmon2:bpH2863c
  Position encoder:
    GIS Azimuth:
      codes:
        - gis:mon:azmon3:azposenc
    MCS Elevation:
      codes:
        - mc:elCurrentPos
    MCS Azimuth:
      codes:
        - mc:azCurrentPos
