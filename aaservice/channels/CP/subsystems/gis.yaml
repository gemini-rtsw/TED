  Thermal Enclosure Temperatures:
    PCS:
      codes:
        - gis:mon:temp:pcs
    CRCS:
      codes:
        - gis:mon:temp:crcs
    SCS:
      codes:
        - gis:mon:temp:scs
    CEM:
      codes:
        - gis:mon:temp:cem
  PMAC output voltage (ALT, Az):
    ALT:
      codes:
        - gis:mon:altmon3:altdspdspc
    Az:
      codes:
        - gis:mon:azmon3:azdspdspc
  Automount Step Numbers:
    Azimuth auto mode:
      codes:
        - gis:az:azmd:azmdautoss
    Elevation auto mode:
      codes:
        - gis:alt:altmd:altmdautoss
  M1 Screw Count:
    +X:
      codes:
        - gis:mon:other:m1posxscrewi
    -X:
      codes:
        - gis:mon:other:m1negxscrewi
    Both:
      codes:
        - gis:mon:other:m1posxscrewi
        - gis:mon:other:m1negxscrewi
  Precipitation sensors:
    Optical (most sensitive):
      codes:
        - gis:misc:precSensor1
    Capacitive:
      codes:
        - gis:misc:precSensor2
  PCS Oil Leak Detection:
    Inner Detector:
      codes:
        - gis:pcs:inners
    Outer Detector:
      codes:
        - gis:pcs:outers
