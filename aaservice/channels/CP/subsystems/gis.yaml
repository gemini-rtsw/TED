    Close Cmd:
      codes:
        - gis:mon:other:closeM1cmd
    Stop Cmd:
      codes:
        - gis:mon:other:stopM1cmd
    M1cover Position:
      codes:
        - gis:mon:other:m1coversums
    M1cover Motion State:
      codes:
        - gis:mon:other:M1covercomb
    M1cover VFD Fault:
      codes:
