input {
  file {
    path => ["/gemsoft/var/log/gpp/navigate/navigate.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-navigate.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601} \["
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
