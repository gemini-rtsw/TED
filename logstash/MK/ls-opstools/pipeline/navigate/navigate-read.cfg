input {
  file {
    path => ["/gemsoft/var/log/gpp/navigate/navigate.${YEAR}-${MONTH}-${DAY}.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-navigate-read-completed.log"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601} \["
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
