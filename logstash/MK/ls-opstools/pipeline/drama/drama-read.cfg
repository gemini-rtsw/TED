input {
  file {
    path => ["/gemsoft/var/log/drama/*/imp_master.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-drama-read-completed.log"
    codec => multiline {
      pattern => "^%{DAY} %{MONTH} +%{MONTHDAY} %{TIME} %{WORD} %{YEAR}"
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
