input {
  file {
    path => ["/gemsoft/var/log/drama/*/imp_master.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-drama.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^%{DAY} %{MONTH} +%{MONTHDAY} %{TIME} %{WORD} %{YEAR}"
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
