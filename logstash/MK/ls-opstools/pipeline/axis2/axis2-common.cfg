filter {
  if [message] =~ /^\s*$/ {
    drop { }
  }

  mutate {
    copy => { "message" => "msg" }
  }

  mutate {
    add_field => {
      "system" => "axis2"
      "location" => "log"
    }
  }

  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }

  mutate {
    remove_field => ["@version", "host", "message", "ts"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "mk.opstools"
    data_stream_namespace => "axis2"
  }
}
