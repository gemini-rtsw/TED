filter {
  if [message] =~ /^\s*$/ {
    drop { }
  }

  grok {
    match => { "message" => ["^(?<ts>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME}): %{GREEDYDATA:msg}"] }
  }

  if "_grokparsefailure" in [tags] {
    drop { }
  }

  date {
    timezone => "${TIMEZONE}"
    locale => "en"
    match => ["ts", "yyyy-MM-dd HH:mm:ss"]
    target => "@timestamp"
  }

  grok {
    match => { "[log][file][path]" => "\.(?<console_app>[A-Za-z]+)\.log$" }
    tag_on_failure => []
  }
  translate {
    source => "console_app"
    target => "system"
    dictionary => {
      "Ql" => "ql"
      "gmosISD" => "gmos-isd"
      "gnirsISD" => "gnirs-isd"
      "altairISD" => "altair-isd"
      "nifsISD" => "nifs-isd"
      "niriISD" => "niri-isd"
      "tsd" => "tsd"
      "tcc" => "tcc-console"
      "seqexec" => "seqexec-console"
    }
    fallback => "console-other"
  }
  mutate {
    add_field => {
      "location" => "log"
      "[data_stream][type]" => "logs"
      "[data_stream][dataset]" => "mk.opstools"
      "[data_stream][namespace]" => "%{system}"
    }
    remove_field => ["console_app"]
  }

  grok {
    match => { "[log][file][path]" => "\.(?<machine>[^./]+)\.[A-Za-z]+\.log$" }
    tag_on_failure => []
  }

  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["ts", "location", "system", "machine", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }

  mutate {
    remove_field => ["@version", "host", "message", "ts"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "mk.opstools"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
