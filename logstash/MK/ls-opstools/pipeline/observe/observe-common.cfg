filter {
  if [message] =~ /^\s*$/ {
    drop { }
  }

  grok {
    match => { "message" => ["(?m)^(?<ts>%{TIMESTAMP_ISO8601}) \[%{DATA:thread}\] %{LOGLEVEL:level}\s+(?<msg>.*)"] }
  }

  if "_grokparsefailure" in [tags] {
    drop { }
  }

  date {
    timezone => "UTC"
    locale => "en"
    match => ["ts", "yyyy-MM-dd HH:mm:ss,SSS"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "system" => "observe"
      "location" => "log"
    }
  }

  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["ts", "location", "system", "machine", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }

  mutate {
    remove_field => ["@version", "host", "message", "ts"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "mk.opstools"
    data_stream_namespace => "observe"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
