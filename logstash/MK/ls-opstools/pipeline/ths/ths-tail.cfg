input {
  file {
    path => ["/gemsoft/var/log/ths/GN_THSgui_*.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-ths.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME} "
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
