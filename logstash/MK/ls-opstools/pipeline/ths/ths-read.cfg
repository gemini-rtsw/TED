input {
  file {
    path => ["/gemsoft/var/log/ths/GN_THSgui_*_${YEAR}${MONTH}${DAY}.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-ths-read-completed.log"
    codec => multiline {
      pattern => "^%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME} "
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
