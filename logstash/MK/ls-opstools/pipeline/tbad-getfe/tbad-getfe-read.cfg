input {
  file {
    path => ["/gemsoft/var/log/tbad/getFE.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-tbad-getfe-read-completed.log"
    codec => multiline {
      pattern => "^--%{YEAR}-%{MONTHNUM}-%{MONTHDAY} "
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
