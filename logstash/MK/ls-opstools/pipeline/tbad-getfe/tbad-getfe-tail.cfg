input {
  file {
    path => ["/gemsoft/var/log/tbad/getFE.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-tbad-getfe.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^--%{YEAR}-%{MONTHNUM}-%{MONTHDAY} "
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
