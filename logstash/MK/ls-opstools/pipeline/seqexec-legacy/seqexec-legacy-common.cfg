filter {
  if [message] =~ /^\s*$/ {
    drop { }
  }

  grok {
    match => { "message" => ["(?m)^%{LOGLEVEL:level} \[%{DATA}\]\s+(?<ts>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME}): (?<msg>.*)"] }
  }

  if "_grokparsefailure" in [tags] {
    drop { }
  }

  date {
    timezone => "${TIMEZONE}"
    locale => "en"
    match => ["ts", "yyyy-MM-dd HH:mm:ss"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "system" => "seqexec-legacy"
      "location" => "log"
    }
  }

  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["ts", "location", "system", "machine", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }

  mutate {
    remove_field => ["@version", "host", "message", "ts"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "mk.opstools"
    data_stream_namespace => "seqexec-legacy"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
