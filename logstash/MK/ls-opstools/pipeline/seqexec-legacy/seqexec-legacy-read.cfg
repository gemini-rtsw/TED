input {
  file {
    path => ["/gemsoft/var/log/seqexec/seqexec_${YEAR}_${MONTH}_${DAY}_*"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-seqexec-legacy-read-completed.log"
    codec => multiline {
      pattern => "^%{LOGLEVEL} \["
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
