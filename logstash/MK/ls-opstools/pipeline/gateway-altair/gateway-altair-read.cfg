input {
  file {
    path => ["/gemsoft/var/log/gateway/altair.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-gateway-altair-read-completed.log"
    codec => multiline {
      pattern => "^%{MONTH} %{MONTHDAY} %{TIME} "
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
