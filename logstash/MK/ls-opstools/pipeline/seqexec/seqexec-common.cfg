filter { 
   grok {
       match => { "message" => "%{YEAR:year}-%{MONTHNUM:month}-%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{GREEDYDATA:msg}" }
   }
   ruby {
	code => "event.set('year', event.get('@timestamp').time.year)"
   }
   mutate {
        add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
   }
   date {
        timezone => "${TIMEZONE}"
        match => ["date","M d yyyy HH:mm:ss,SSS"]
        target => "@timestamp"
   }
   mutate {
       add_field => {"system" => "seqexec"}
       add_field => {"location" => "log"}
   }

   ruby {
       path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
   }

   fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","system","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => "true"
   }
   mutate {
       remove_field => ["@version","host","message","month","time","monthday","year"]
   }

}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "mk.opstools"
            data_stream_namespace =>"seqexec-ng"
            document_id => "%{[@metadata][fingerprint]}"
        }  
    } 
}
