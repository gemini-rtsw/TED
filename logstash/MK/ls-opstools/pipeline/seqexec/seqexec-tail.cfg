input {
  file {
    path => ["/gemsoft/var/log/seqexec/seqexec_*"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-seqexec.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^%{LOGLEVEL} \["
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
