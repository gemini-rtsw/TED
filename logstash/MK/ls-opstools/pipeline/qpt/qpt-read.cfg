input {
  file {
    path => ["/gemsoft/var/log/qpt/qpt.${YEAR}${MONTH}${DAY}-*.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-qpt-read-completed.log"
    codec => multiline {
      pattern => "^%{MONTH} %{MONTHDAY}, %{YEAR} "
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
