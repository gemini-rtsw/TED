input {
  file {
    path => ["/gemsoft/var/log/ot/ot.*.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-ot.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^%{MONTH} %{MONTHDAY}, %{YEAR} "
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
