input {
  file {
    path => ["/gemsoft/var/log/ltts/ltts.production.north.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-ltts-read-completed.log"
    codec => multiline {
      pattern => "^%{LOGLEVEL}\s+\["
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
