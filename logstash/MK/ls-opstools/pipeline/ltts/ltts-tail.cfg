input {
  file {
    path => ["/gemsoft/var/log/ltts/ltts.production.north.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-ltts.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^%{LOGLEVEL}\s+\["
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
