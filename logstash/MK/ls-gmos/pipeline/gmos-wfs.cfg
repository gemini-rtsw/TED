input {
    file {
        path => ["/gemsoft/var/serialcon/mkocomprm/oiwfs.*"]
	    mode => "tail"
        sincedb_path=> "/db/sincedb/mk-oiwfs.log"
        close_older => "2 m"
        start_position=> "beginning"
    }
}

filter {
   grok {
       match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{GREEDYDATA:msg}:%{SPACE}" }
   }
   ruby {
	code => "event.set('year', event.get('@timestamp').time.year)"
   }
   mutate {
        add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
   }
   date {
        timezone => "${TIMEZONE}"
        match => ["date","MMM d yyyy HH:mm:ss"]
        target => "@timestamp"
   }
   mutate {
       add_field => {"system" => "gmos"}
       add_field => {"subsystem" => "wfs"}
       add_field => {"location" => "serialcon"}
   }
   ruby {
       path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
   }

   fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","system","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => "true"
   }
   mutate {
       remove_field => ["@version","host","message","month","time","monthday","year","date"]
   }

}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "mk.instruments"
            data_stream_namespace =>"gmos-wfs"
            document_id => "%{[@metadata][fingerprint]}"
        }  
    } 
}
