filter {
  # some consoles end lines with \n\r, leaving a \r at the start of the next line
  mutate {
    gsub => ["message", "\r", ""]
  }

  if [message] =~ /^\s*$/ {
    drop { }
  }

  grok {
    match => { "message" => ["^<(?<ts>%{MONTHDAY}/%{MONTHNUM}/%{YEAR} %{TIME})(?: %{WORD})?>%{GREEDYDATA:msg}", "^(?<ts>%{MONTH} +%{MONTHDAY} %{TIME}) : %{GREEDYDATA:msg}"] }
  }

  if "_grokparsefailure" in [tags] {
    drop { }
  }

  date {
    timezone => "${TIMEZONE}"
    locale => "en"
    match => ["ts", "d/M/yyyy H:mm:ss", "MMM d HH:mm:ss"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "system" => "bto-epics"
      "location" => "serialcon"
    }
  }

  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["ts", "location", "system", "machine", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }

  mutate {
    remove_field => ["@version", "host", "message", "ts"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "mk.instruments"
    data_stream_namespace => "bto-epics"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
