input {
  file {
    path => "/gemsoft/var/serialcon/cntrsect/${YEAR}${MONTH}${DAY}/pcs*"
    mode => "read"
    sincedb_path => "/db/sincedb/mk-pcs.log"
    close_older => "2 m"
    start_position => "beginning"  
  }
}

filter {
  grok {
    match => { 
      "message" => "<%{MONTHDAY:monthday}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD}>%{GREEDYDATA:msg}" 
    }
  }

  mutate {
    add_field => {
      "date" => "%{year} %{month} %{monthday} %{time}"
    }
  }

  date {
    timezone => "${TIMEZONE}"
    match => ["date", "YYYY M dd HH:mm:ss"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "system" => "pcs"
      "location" => "serialcon"
    }
  }

  ruby {
    path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["date", "location", "system", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => "true"
  }

  mutate {
    remove_field => ["@version", "host", "message", "year", "month", "monthday", "time", "date"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    sniffing => "true"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "mk.core"
    data_stream_namespace => "pcs"
    document_id => "%{[@metadata][fingerprint]}"
  }
}

