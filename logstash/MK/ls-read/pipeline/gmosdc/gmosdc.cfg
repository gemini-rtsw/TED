input {
    file {
        path => ["/gemsoft/var/serialcon/gmos/${YEAR}${MONTH}${DAY}/gmosdc*"]
	mode => "read"
        sincedb_path=> "/db/sincedb/mk-gmosdc.log"
        start_position=> "beginning"
    }
}

filter {
   grok {
       match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}:%{SPACE}%{GREEDYDATA:msg}" }
   }
   ruby {
	code => "event.set('year', ${YEAR})"
   }
   mutate {
        add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]} # Create field 'date' from record info
   }
   date {
        timezone => "${TIMEZONE}"
        match => ["date","MMM d yyyy HH:mm:ss"]
        target => "@timestamp"
   }
   mutate {
       add_field => {"subsystem" => "gmosdc"}
       add_field => {"location" => "serialcon"}
   }
   ruby {
       path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
   }

   fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
   }
   mutate {
       remove_field => ["@version","host","message","month","time","monthday","year"]
   }

}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true" # The output is a datastream
            data_stream_type => "logs"
            data_stream_dataset => "mk.instruments"
            data_stream_namespace =>"gmosdc" # The datstream will have the name: 'logs-iocs-mcs'
            document_id => "%{[@metadata][fingerprint]}"
        }  
    } 
}
