input {
    file {
        path => ["/gemsoft/var/serialcon/altair/${YEAR}${MONTH}${DAY}/altairIOC*"]
	    mode => "read"
        sincedb_path=> "/db/sincedb/mk-altairioc.log"
        start_position=> "beginning"
    }
}

filter {
   grok {
       match => { "message" => "<%{MONTHDAY:monthday}/%{MONTHNUM:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD}>%{GREEDYDATA:msg}" }
   }
   mutate {
        add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
   }
   date {
        timezone => "${TIMEZONE}"
        match => ["date","M d yyyy HH:mm:ss"]
        target => "@timestamp"
   }
   mutate {
       add_field => {"subsystem" => "altair-ioc"}
       add_field => {"location" => "serialcon"}
   }
   ruby {
       path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
   }

   fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","system","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => "true"
   }
   mutate {
       remove_field => ["@version","host","message","month","time","monthday","year","date"]
   }

}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "mk.instruments"
            data_stream_namespace =>"altair-ioc"
            document_id => "%{[@metadata][fingerprint]}"
        }  
    } 
}
