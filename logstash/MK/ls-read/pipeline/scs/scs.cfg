input{
  file {
    path => "/gemsoft/var/serialcon/cntrsect/${YEAR}${MONTH}${DAY}/scs.dat.log"
    mode => "read"
    sincedb_path=> "/db/sincedb/mk-scs.log"
    close_older => "2m"
    file_completed_action => "log"
    file_completed_log_path => "/db/completed/mk-scs.log"
  }
}

filter {
  grok {
    match => {
      "message" => "<%{MONTHDAY:monthday}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD}>%{GREEDYDATA:msg}" 
    }
  }
  mutate {
    add_field => {
      "log_date" => "%{year} %{month} %{monthday} %{time}"
    }
  }
  date {
    timezone => "${TIMEZONE}"
    match => ["log_date","YYYY M dd HH:mm:ss"]
    target => "@timestamp"
  }
  mutate {
    add_field => {
      "subsystem" => "scs"
      "location" => "serialcon"
    }
  }
  ruby {
    path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
  }
  fingerprint {
      key => "key"
      method => "SHA256"
      source => ["log_date","location","subsystem","msg"]
      target => "[@metadata][fingerprint]"
      concatenate_sources => true
  }
  mutate {
    remove_field => ["@version","host","message","year","monthday","day","time","log_date"]
  }
}

output {
    if "_grokparsefailure" not in [tags] {
   	 elasticsearch {
   	     hosts => "${HOST_1}"
   	     sniffing => "true"
   	     data_stream => "true"
   	     data_stream_type => "logs"
   	     data_stream_dataset => "mk.core"
   	     data_stream_namespace => "scs"
   	     document_id => "%{[@metadata][fingerprint]}"
   	 }
    }
}
