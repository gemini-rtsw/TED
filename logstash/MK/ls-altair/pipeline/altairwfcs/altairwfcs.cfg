input {
    file {
        path => ["/gemsoft/var/serialcon/altair/altairMain1X.dat","/gemsoft/var/serialcon/altair/altairOpt2Y.dat","/gemsoft/var/serialcon/altair/altairRecon1Y.dat","/gemsoft/var/serialcon/altair/altairStatDisp2X.dat"]
	mode => "tail"
        sincedb_path=> "/db/sincedb/mk-altairwfcs.log"
        start_position=> "beginning"
    }
}

filter {
   grok {
       match => { "message" => "<%{MONTHDAY:monthday}/%{MONTHNUM:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD}>%{GREEDYDATA:msg}" }
   }
   mutate {
        add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]} # Create field 'date' from record info
   }
   date {
        timezone => "${TIMEZONE}"
        match => ["date","M d yyyy HH:mm:ss"]
        target => "@timestamp"
   }
   mutate {
       add_field => {"subsystem" => "altairwfcs"}
       add_field => {"location" => "serialcon"}
   }
   ruby {
       path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
   }

   fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
   }
   mutate {
       remove_field => ["@version","host","message","month","time","monthday","year"]
   }

}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true" # The output is a datastream
            data_stream_type => "logs"
            data_stream_dataset => "mk.instruments"
            data_stream_namespace =>"altairwfcs" # The datstream will have the name: 'logs-iocs-mcs'
            document_id => "%{[@metadata][fingerprint]}"
        }  
    } 
}
