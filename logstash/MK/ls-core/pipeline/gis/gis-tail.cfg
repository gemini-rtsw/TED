# serialcon .dat files are sparse: each day they gain a run of NUL bytes
# (often >64 MB, larger than a persisted-queue page) that the file input
# reads as one line. tail -F follows truncation; tr strips the NULs.
input {
  pipe {
    command => "tail -q -n +1 -F /gemsoft/var/serialcon/mkocomprm/gis.dat 2>/dev/null | stdbuf -oL tr -d '\000'"
    add_field => { "[log][file][path]" => "/gemsoft/var/serialcon/mkocomprm/gis.dat" }
    codec => multiline {
      pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}"
      negate => "true"
      what => "previous"
    }
  }
}
