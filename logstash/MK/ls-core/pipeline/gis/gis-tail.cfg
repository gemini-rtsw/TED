input {
  file {
    path => ["/gemsoft/var/serialcon/mkocomprm/gis.dat"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-gis.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}"
      negate => "true"
      what => "previous"
    }
  }
}

