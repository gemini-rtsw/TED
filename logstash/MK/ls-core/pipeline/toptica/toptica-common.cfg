filter {
  mutate {
    gsub => ["message", "\e\[[0-9;?]*[A-Za-z]", ""]
  }

  if [message] =~ /^\s*$/ {
    drop { }
  }

  grok {
    match => { "message" => ["^(?:%{DAY} %{MONTH} +%{MONTHDAY} %{TIME} %{YEAR} )?(?<ts>%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}) %{GREEDYDATA:msg}"] }
  }

  if "_grokparsefailure" in [tags] {
    drop { }
  }

  date {
    timezone => "${TIMEZONE}"
    locale => "en"
    match => ["ts", "yyyy/MM/dd HH:mm:ss.SSSSSS"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "system" => "toptica"
      "location" => "sioc"
    }
  }

  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["ts", "location", "system", "machine", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }

  mutate {
    remove_field => ["@version", "host", "message", "ts"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "mk.core"
    data_stream_namespace => "toptica"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
