input {
  file {
    path => ["/gemsoft/var/serialcon/agwfs/ag.dat"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-ag.log"
    close_older => "2 m"
    start_position => "beginning"
  }
}

filter {
  grok {
    match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}:%{SPACE}%{GREEDYDATA:msg}" }
  }

  mutate {
    add_field => {
      "system" => "ag"
      "location" => "serialcon"
    }
  }

  ruby {
    code => "event.set('year', event.get('@timestamp').time.year)"
  }

  mutate {
    add_field => {
      "date" => "%{year} %{month} %{monthday} %{time}"
    }
  }

  date {
    timezone => "${TIMEZONE}"
    match => ["date", "YYYY MMM d HH:mm:ss"]
    target => "@timestamp"
  }

  ruby {
    path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["date", "location", "system", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }

  mutate {
    remove_field => ["@version", "host", "message", "year", "month", "monthday", "time", "date"]
  }
}

output {
  if '_grokparsefailure' not in [tags] {
    elasticsearch {
      hosts => "${HOST_1}"
      sniffing => "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "mk.core"
      data_stream_namespace => "ag"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}

