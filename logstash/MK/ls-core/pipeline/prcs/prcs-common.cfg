filter {
  grok {
   	match => { "message" => "%{WORD}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{YEAR:year}%{NOTSPACE}%{SPACE}%{GREEDYDATA:msg}" }
    }
}

filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{monthday} %{time}"]
    }
  }
  date {
    timezone =>"${TIMEZONE}"
    match => ["date","YYYY MMM dd HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"system" => "prcs"}
      add_field => {"location" => "mk"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","system","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","monthday","time","date"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    sniffing => "true"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "mk.core"
    data_stream_namespace => "prcs"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
