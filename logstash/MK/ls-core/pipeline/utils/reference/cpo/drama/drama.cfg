input {
  file {
    path => "/usr/logs/log/cpo/drama/cpodhs0*/imp_master.log"
    mode => "${LOGSTASH_MODE}" 
    sincedb_path => "/db/sincedb/cpo-drama.log"
    close_older => "2 m"
    start_position=> "beginning"
  }
}

filter {
  mutate {
    add_field => { 
      "msg" => "%{message}" 
      "subsystem" => "drama"
      "location" => "cpo"
    }
  }
  ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

output {
   null {}
}

