input {
    file {
        # READ MODE - uncomment to load historic data (and comment TAIL MODE)
        path => ["/gemsoft/var/serialcon/mount/mcs.*"]
	mode => "tail"	
        sincedb_path=> "/db/sincedb/mk-mcs.log"
        close_older => "2 m" # Closes file after 2 minutes of inactivity
        start_position=> "beginning"
    }
}

filter { #Dissect message into significant fields 
   grok {
       match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}:%{SPACE}%{GREEDYDATA:msg}" }
   }
   ruby {
	code => "event.set('year', event.get('@timestamp').time.year)"
   }
   mutate {
        add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]} # Create field 'date' from record info
   }
   date {
        timezone => "${TIMEZONE}" # Apply timezone
        match => ["date","MMM d yyyy HH:mm:ss"]
        target => "@timestamp"
   }
   mutate {
       add_field => {"subsystem" => "mcs"}
       add_field => {"location" => "serialcon"}
   }
   ruby {
       path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
   }

   fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
   }
   mutate {
       remove_field => ["@version","host","message","month","time","monthday","year"]
   }

}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true" # The output is a datastream
            data_stream_type => "logs"
            data_stream_dataset => "mk.core"
            data_stream_namespace =>"mcs" # The datstream will have the name: 'logs-iocs-mcs'
            document_id => "%{[@metadata][fingerprint]}"
        }  
    } 
}
