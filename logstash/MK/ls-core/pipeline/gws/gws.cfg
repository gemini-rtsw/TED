input {
  file {
    path => "/gemsoft/var/log/gws/*"
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-gws.log"
    close_older => "2 m"
    start_position=> "beginning"
  }
}

filter {
  mutate {
    add_field => { 
      "msg" => "%{message}" 
      "subsystem" => "gws"
      "location" => "mk"
    }
  }
}

filter {
  fingerprint {
    key => "key"
    method => "SHA512"
    source => ["@timestamp", "location", "subsystem", "message"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }
}

filter {
    mutate {
        remove_field => ["@version","host","message"]
    }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    sniffing => true
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "mk.core"
    data_stream_namespace => "gws"
    document_id => "%{[@metadata][fingerprint]}"
  }
}


