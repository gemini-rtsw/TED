input {
  file {
    path => ["/gemsoft/var/serialcon/mkocomprm/${YEAR}${MONTH}${DAY}/tcs*"]
    mode => "read"
    start_position => "beginning"
    codec => multiline {
      pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}"
      negate => "true"
      what => "previous"
    }
  }
}