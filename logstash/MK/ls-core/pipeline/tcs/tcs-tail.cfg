input {
  file {
    path => ["/gemsoft/var/serialcon/mkocomprm/tcs.dat"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-tcs.log"
    close_older => "2 m"
    start_position => "beginning"
    codec => multiline {
      pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}"
      negate => "true"
      what => "previous"
    }
  }
}