input {
  file {
    path => ["/gemsoft/var/log/tcc/*"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-tcc.log"
    close_older => "2 m"
    start_position => "beginning"
  }
}

filter {
  grok {
    match => { "message" => "%{DAY}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:day}%{SPACE}%{TIME:time}%{SPACE}%{WORD}%{SPACE}%{YEAR:year}%{SPACE}%{GREEDYDATA:msg}" }
  }

  mutate {
    add_field => {
      "subsystem" => "tcc"
      "location" => "log"
    }
  }

  mutate {
    add_field => {
      "date" => "%{year} %{month} %{monthday} %{time}"
    }
  }

  date {
    timezone => "${TIMEZONE}"
    match => ["date", "YYYY MMM d HH:mm:ss"]
    target => "@timestamp"
  }

  ruby {
    path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["date", "location", "system", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => "true"
  }

  mutate {
    remove_field => ["@version", "host", "message", "year", "month", "monthday", "time", "date"]
  }
}

output {
  if '_grokparsefailure' not in [tags] {
    elasticsearch {
      hosts => "${HOST_1}"
      sniffing => "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "mk.core"
      data_stream_namespace => "tcc"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}

