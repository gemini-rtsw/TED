input {
  file {
    path => ["/gemsoft/var/log/sioc/ltcss/*.log"]
    mode => "read"
    start_position => "beginning"
    file_completed_action => "log"
    file_completed_log_path => "/db/sincedb/mk-ltcss-read-completed.log"
    codec => multiline {
      pattern => "^\[%{DAY} %{MONTH}"
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
