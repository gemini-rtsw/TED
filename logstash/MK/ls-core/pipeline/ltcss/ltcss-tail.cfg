input {
  file {
    path => ["/gemsoft/var/log/sioc/ltcss/*.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/mk-ltcss.log"
    start_position => "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "^\[%{DAY} %{MONTH}"
      negate => true
      what => "previous"
      auto_flush_interval => 5
    }
  }
}
