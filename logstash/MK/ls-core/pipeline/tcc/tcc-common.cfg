filter {
  grok {
    match => { "message" => "%{DAY}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{WORD}%{SPACE}%{YEAR:year}%{SPACE}%{GREEDYDATA:msg}" }
  }

  mutate {
    add_field => {
      "system" => "tcc"
      "location" => "log"
    }
  }

  mutate {
    add_field => {
      "date" => "%{year} %{month} %{monthday} %{time}"
    }
  }

  date {
    timezone => "${TIMEZONE}"
    match => ["date", "YYYY MMM d HH:mm:ss"]
    target => "@timestamp"
  }

  # tcclog_<workstation>.HH_MM: record which workstation ran the TCC
  grok {
    match => { "[log][file][path]" => "tcclog_(?<machine>[^./]+)\." }
    tag_on_failure => []
  }

  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["date", "location", "system", "machine", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => "true"
  }

  mutate {
    remove_field => ["@version", "host", "message", "year", "month", "monthday", "time", "date"]
  }
}

output {
  if '_grokparsefailure' not in [tags] {
    elasticsearch {
      hosts => "${HOST_1}"
      sniffing => "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "mk.core"
      data_stream_namespace => "tcc"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}

