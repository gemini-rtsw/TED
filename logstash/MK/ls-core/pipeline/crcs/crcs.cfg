input {
  file {
    path => "/gemsoft/var/serialcon/cntrsect/crcs.dat"
    mode => tail
    sincedb_path => "/db/sincedb/mk-crcs.log"
    close_older => "2m"
    start_position => "beginning"
  }
}

filter {
  grok {
    match => { 
      "message" => "<%{MONTHDAY:monthday}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD}>%{GREEDYDATA:msg}" 
    }
  }

  mutate {
    add_field => {
      "log_date" => "%{year} %{month} %{monthday} %{time}"
    }
  }

  date {
    timezone => "${TIMEZONE}"
    match => ["log_date", "YYYY M dd HH:mm:ss"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "subsystem" => "crcs"
      "location" => "serialcon"
    }
  }

  ruby {
    path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
  }

  fingerprint {
    key => "key"
    method => "SHA256"
    source => ["log_date", "location", "subsystem", "msg"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }

  mutate {
    remove_field => ["@version", "host", "message", "year", "month", "monthday", "time", "log_date"]
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    sniffing => "true"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "mk.core"
    data_stream_namespace => "crcs"
    document_id => "%{[@metadata][fingerprint]}"
  }
}

