# serialcon .dat files are sparse: each day they gain a run of NUL bytes
# (often >64 MB, larger than a persisted-queue page) that the file input
# reads as one line. The anemometer never writes newlines, so records are
# split at each '<' timestamp marker instead. tail -F follows truncation; tr strips the NULs.
input {
  pipe {
    command => "tail -q -n +1 -F /gemsoft/var/serialcon/cntrsect/anemometer.dat 2>/dev/null | stdbuf -o0 tr -d '\000\r' | stdbuf -oL tr '<' '\n'"
    add_field => { "[log][file][path]" => "/gemsoft/var/serialcon/cntrsect/anemometer.dat" }
  }
}
