services:
  ls-gnirs:
    image: ted-logstash:8.15.0
    hostname: ls-ghost
    container_name: ls-ghost
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    build:
      context: "../"
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}
    networks:
      - ted_network

    environment:
      HOST_1: "es01:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./config:/usr/share/logstash/config"
      - "./pipeline:/usr/share/logstash/pipeline"
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls-ghost/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1


networks:
  ted_network:
    driver: bridge
    external: true