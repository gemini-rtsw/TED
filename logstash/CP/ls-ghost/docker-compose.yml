services:
  ls-ghost:
    image: ted-logstash:9.1.4
    hostname: ls-ghost
    container_name: ls-ghost
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    build:
      context: "../"
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    network_mode: host

    environment:
      HOST_1: "${HOST1_IP}:${ES1_HTTP_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./config:/usr/share/logstash/config"
      - "./pipeline:/usr/share/logstash/pipeline"
      - "../../utils:/usr/share/logstash/utils"
      - ${LOGS_PATH}/log/ghost:/gemsoft/var/log/ghost
      - ${DATA_PATH}/ls-ghost/db:/db
      - /etc/localtime:/etc/localtime

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1