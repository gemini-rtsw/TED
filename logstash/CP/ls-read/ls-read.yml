services:
  ls-read:
    image: ted-logstash:9.1.4
    hostname: ls-read
    container_name: ls-read
    network_mode: host
    environment:
      HOST_1: "http://${HOST2_IP}:${ES1_HTTP_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"
      DAY: "${DAY}"
      MONTH: "${MONTH}"
      YEAR: "${YEAR}"
    volumes:
      - ./config:/usr/share/logstash/config
      - ./pipeline:/usr/share/logstash/pipeline
      - ../../utils:/usr/share/logstash/utils
      - ${LOGS_PATH}:/gemsoft/var/log
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1