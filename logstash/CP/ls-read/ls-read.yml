services:
  ls-read:
    image: ted-logstash:8.15.0
    hostname: ls-read
    container_name: ls-read
    networks:
      - ted_network
    ports:
      - "9600:9600"
    environment:
      HOST_1: "http://${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"
      DAY: "${DAY}"
      MONTH: "${MONTH}"
      YEAR: "${YEAR}"
    volumes:
      - ./config:/usr/share/logstash/config
      - ./pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/gemsoft/var
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1
networks:
  ted_network:
    driver: bridge
    external: true
