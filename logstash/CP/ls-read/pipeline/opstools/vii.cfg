input {
    file {
        path => ["/gemsoft/var/log/cpo/vii/vis${YEAR}*.*","/gemsoft/var/log/sbf/vii/vis${YEAR}*.*"] 
        mode => "read"
        close_older => "2 m"
    }
}
filter {
    grok {
        match => { 
            "[log][file][path]" => "/gemsoft/var/log/%{WORD:location}"
        }
    }
    grok {
        match => { "message" => "%{YEAR:year}/%{MONTHNUM:month}/%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{WORD:client}%{SPACE}%{GREEDYDATA:msg}" }
    	}
    if '_grokparsefailure' in [tags]{
        grok {
            match => { "message" => "#%{SPACE}%{WORD}%{SPACE}%{WORD}%{SPACE}%{WORD}%{SPACE}%{WORD}%{SPACE}" }
            add_tag=> ["header"]
    	}
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
} 
filter {
    if '_grokparsefailure' not in  [tags]{
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
        }
    }else{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}%{NOTSPACE:month}%{MONTHDAY:monthday}"}

	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year}"]}
        }
    }
    date {
            timezone =>"${TIMEZONE}"
            match => ["date","M dd yyyy","MM d yyyy","M dd yyyy","M d yyyy","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "MMM dd yyyy", "MMM d yyyy","MMM dd yyyy HH:mm:ss", "MMM d yyyy HH:mm:ss"]
            target => "@timestamp"
	}
}

filter {
    mutate {
        add_field => {"subsystem" => "vii"}
        update => { "msg" => "(%{client}) %{msg}"}
    }
}

filter {
    if '_grokparsefailure' in [tags]{
        mutate {
            add_field => { "client" => "%{[log][file][path]}" }
        }
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
    }
}

output {
    if 'header' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}" 
            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "cp.opstools"
            data_stream_namespace =>"vii"
            document_id => "%{[@metadata][fingerprint]}"
        }   
    }
}