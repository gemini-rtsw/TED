input{
  file {    
    path => ["/gemsoft/var/log/flam-pre/*"]
    mode => "read"
    exclude => ["edttime.log","caRepeater*"]
    }
  }
filter {
  grok {
   	match => { "message" => "%{DAY}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{WORD}%{SPACE}%{YEAR:year}%{GREEDYDATA:msg}" }
    }
}


filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{monthday} %{time}"]
      }
    }
  date {
    timezone => "${TIMEZONE}"
    match => ["date","YYYY MMM d HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"subsystem" => "f2-sparc"}
      add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA512"
        source => ["date","location","subsystem","msg","[log][file][path]"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => "true"
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","monthday","time","date"]
  }
}

output {
  if '_grokparsefailure' not in [tags]{
    elasticsearch {
      hosts => "${HOST_1}"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "cp.instruments"
      data_stream_namespace => "f2-sparc"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}
