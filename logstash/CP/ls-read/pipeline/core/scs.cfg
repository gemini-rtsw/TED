input{
  file {
    path => '/gemsoft/var/log/serialcon/cpowtipwr-ap2/scs/${YEAR}-${MONTH}/${YEAR}-${MONTH}-${DAY}*.log'
    mode => "read"
    close_older => "2 m"
  }
}
filter {
  grok {
   	match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:day}%{SPACE}%{TIME:time}%{SPACE}%{WORD}\)%{SPACE}%{WORD}:%{SPACE}%{WORD},%{SPACE}%{WORD}:%{SPACE}%{GREEDYDATA:msg}" }
    }
}

filter {
  grok {
    match => { "[log][file][path]" => "%{YEAR:year}" }
	}
}

filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{day} %{time}"]
    }
  }
  date {
    timezone =>"${TIMEZONE}"
    match => ["date","YYYY MMM dd HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
  mutate {
    add_field => {"subsystem" => "scs"}
    add_field => {"location" => "serialcon"}
  }
}

filter{
  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","date"]
  }
}

output {
    elasticsearch {
        hosts => "${HOST_1}"
        sniffing => "true"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cp.core"
        data_stream_namespace => "scs"
        document_id => "%{[@metadata][fingerprint]}"
    }
}