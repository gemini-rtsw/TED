input{
  file {    
    path => ["/gemsoft/var/log/serialcon/flamperle/${YEAR}${MONTH}${DAY}/f2opc.*"]
    exclude => ["SolarisSparcTTYB.dat","UFMCE4.dat"]
    mode => "read"
    close_older => "2 m"
    codec => multiline {
        pattern => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}"
        negate => "true"
        what => "previous"
    }
  }
}