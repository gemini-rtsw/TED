input{
  file {    
    path => ["/gemsoft/var/log/serialcon/flamperle/f2opc.*"]
    exclude => ["SolarisSparcTTYB.dat","UFMCE4.dat"]
    mode => "tail"
    sincedb_path=> "/db/sincedb/serialcon-f2opc.log"
    start_position=> "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
        pattern => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}"
        negate => "true"
        what => "previous"
        auto_flush_interval => 5
    }
  }
}