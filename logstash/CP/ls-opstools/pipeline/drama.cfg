input {
  file {
    path => ["/gemsoft/var/log/cpo/drama/cpodhs*/imp_master.log","/gemsoft/var/log/cpo/drama/cpotelops*/imp_master.log",
            "/gemsoft/var/log/sbf/drama/sbftelops*/imp_master.log","/gemsoft/var/log/sbf/drama/sbftopsdev*/imp_master.log"]
    mode => "tail"
    sincedb_path => "/db/sincedb/cpo-drama.log"
    close_older => "2 m"
    codec => multiline {
        pattern => "^[A-Z][a-z]{2} [A-Z][a-z]{2} \d{1,2} \d{2}:\d{2}:\d{2} [-+]\d{2} \d{4}"
        negate => "true"
        what => "previous"
    }
  }
}

filter {
    grok {
        match => { 
        "[log][file][path]" =>  "/gemsoft/var/log/%{WORD:location}/drama/%{GREEDYDATA:hostname}/%{GREEDYDATA}"
        }
    }
    grok{
        match => { "message" => "%{WORD}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}-%{WORD}%{SPACE}%{YEAR:year}" }
    }
    mutate {
        add_field => { 
            "msg" => "%{message}" 
            "subsystem" => "drama"
        }

    }
    mutate {
        add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
        update => { "msg" => "(%{hostname}) %{msg}"}
    }
    date {
        timezone =>"${TIMEZONE}"
        match => ["date","MMM d yyyy HH:mm:ss"]
        target => "@timestamp"
    }
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","hostname","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => "true"
    }
    mutate {
        remove_field => ["@version","date","host","hostname","message","month","time","monthday","year","hour","minute","second","halfday"]
    }   
    
    ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

output {
    elasticsearch {
        hosts => "${HOST_1}"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cp.opstools"
        data_stream_namespace =>"drama"
        document_id => "%{[@metadata][fingerprint]}"
    }  
}

