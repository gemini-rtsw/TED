input {
    file {
        path => "/gemsoft/var/log/cpo/seqexec-ng/seqexec-ng.log" # Path of input file
        mode => "tail"
        sincedb_path=> "/db/sincedb/cpo-seqexec-ng.log"
        start_position=> "beginning"
        close_older => 43200
        ignore_older => 86400
        codec => multiline { # Identifies multiline log
          pattern => "%{TIMESTAMP_ISO8601}%{SPACE}\[%{NOTSPACE}\]" #Grok pattern to identify
          negate => "true" #If pattern is found it can be a multiline header or a single line record 
          what => "previous" # If pattern deoesn't match, it is attached to the previous multiline record 
        }
	}
}