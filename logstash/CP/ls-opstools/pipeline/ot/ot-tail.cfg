input {
    file {
        path => "/gemsoft/var/log/sbf/ot/*" 
        mode => "tail"
        sincedb_path=> "/db/sincedb/sbf-ot.log"
        close_older => 43200
        ignore_older => 86400
        start_position => "beginning"
        codec => multiline {
          pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday},%{SPACE}%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD:halfday}"
          negate => "true"
          what => "previous"
          max_lines => "10000"
          max_bytes => "30 MiB"
        }
	}
}