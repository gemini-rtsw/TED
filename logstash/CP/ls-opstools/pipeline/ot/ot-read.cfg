input {
    file {
        path => "/gemsoft/var/log/sbf/ot/ot.${YEAR}${MONTH}${DAY}*" 
        mode => "read"
        codec => multiline {
          pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday},%{SPACE}%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD:halfday}"
          negate => "true"
          what => "previous"
          max_lines => "10000"
          max_bytes => "30 MiB"
        }
	}
}