input {
    file {
        path => ["/gemsoft/var/log/cpo/qpt/*.*","/gemsoft/var/log/sbf/qpt/*.*"] 
        mode => "tail" 
        sincedb_path=> "/db/sincedb/cp-qpt.log"
        start_position => "beginning"
        close_older => 43200
        ignore_older => 86400
        codec => multiline {
          pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday},%{SPACE}%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD:halfday}"
          negate => "true"
          what => "previous"
        }
	}
}