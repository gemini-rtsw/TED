input {
    file {
        path => ["/gemsoft/var/log/cpo/qpt/qpt.${YEAR}${MONTH}${DAY}*","/gemsoft/var/log/sbf/qpt/qpt.${YEAR}${MONTH}${DAY}*"] 
        mode => "read" 
        codec => multiline {
          pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday},%{SPACE}%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD:halfday}"
          negate => "true"
          what => "previous"
        }
	}
}