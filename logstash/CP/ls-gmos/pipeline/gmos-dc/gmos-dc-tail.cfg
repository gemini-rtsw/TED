input{
  file {
    path => ['/gemsoft/var/log/serialcon/gmos-perle/gmos-dc.dat']
    mode => "tail" 
    sincedb_path=> "/db/sincedb/serialcon-gmos-dc.log"
    start_position=> "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}"
      negate => "true"
      what => "previous"
    }
  }
}