input{
  file {
    
    path => ['/gemsoft/var/log/serialcon/gmos-perle/gmos-dc.dat']
    mode => "tail" 
    sincedb_path=> "/db/sincedb/serialcon-gmos-dc.log"
    start_position=> "beginning"
    ignore_older => 86400
    close_older => 43200
    codec => multiline {
      pattern => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}"
      negate => "true"
      what => "previous"
    }
  }
}
filter {
  grok {
   	match => { "message" => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}>%{GREEDYDATA:msg}" }
    }
}

filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{day} %{time}"]
      }
    }
  date {
    timezone => "${TIMEZONE}"
    match => ["date","YYYY M d HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
        add_field => {"subsystem" => "dc"}
        add_field => {"system" => "gmos"}
        add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/order_handler.rb"
      }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","system","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => "true"
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","date"]
  }
}

output {
  if '_grokparsefailure' not in [tags]{
    elasticsearch {
        hosts => "${HOST_1}"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cp.instruments"
        data_stream_namespace =>"gmos-dc"
        document_id => "%{[@metadata][fingerprint]}"
    }
  }
}