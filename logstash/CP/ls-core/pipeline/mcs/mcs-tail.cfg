input {
    file {
        # READ MODE - uncomment to load historic data (and comment TAIL MODE)
        path => ["/gemsoft/var/log/serialcon/mcs/*"]
        mode => "tail"
        sincedb_path=> "/db/sincedb/serialcon-mcs.log"
        close_older => 43200
        ignore_older => 86400
        start_position=> "beginning"
        codec => multiline { # Identifies multiline log
          pattern => "CS9000 NFS:" #Pattern to identify
          negate => "false" # If pattern is found it can be a multiline header or a single line record 
          what => "next" # If pattern deoesn't match, it is attached to the previous multiline record 
          charset => "ASCII" # Specify charset   
        }
    }
}