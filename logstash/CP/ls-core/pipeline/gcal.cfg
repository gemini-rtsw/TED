input{
  file {
    path => '/gemsoft/var/log/serialcon/cpowtipwr-ap4/gcal/*/*.log'
    mode => "tail"
    sincedb_path=> "/db/sincedb/serialcon-gcal.log"
    close_older => 43200
    ignore_older => 86400
  }
}

filter {
  grok {
   	match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:day}%{SPACE}%{TIME:time}%{SPACE}%{WORD}:%{SPACE}%{NOTSPACE}%{SPACE}%{WORD}:%{SPACE}%{GREEDYDATA:msg}" }
    }
}


filter {
  grok {
    match => { "[log][file][path]" => "%{YEAR:year}" }
	}
}

filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{day} %{time}"]
      }
    }
  date {
    timezone =>"${TIMEZONE}"
    match => ["date","YYYY MMM dd HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"system" => "gcal"}
      add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","system","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","date"]
  }
}

output {
    elasticsearch {
        hosts => "${HOST_1}"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cp.core"
        data_stream_namespace => "gcal"
        document_id => "%{[@metadata][fingerprint]}"
    }
}