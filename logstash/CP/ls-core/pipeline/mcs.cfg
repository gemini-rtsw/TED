input {
    file {
        # READ MODE - uncomment to load historic data (and comment TAIL MODE)
        path => ["/gemsoft/var/log/serialcon/mcs/*.*"]
        mode => "tail" 

        sincedb_path=> "/db/sincedb/serialcon-mcs.log"

        close_older => 43200
        ignore_older => 86400

        start_position=> "beginning"

        codec => multiline { # Identifies multiline log
          pattern => "CS9000 NFS:" #Pattern to identify
          negate => "false" # If pattern is found it can be a multiline header or a single line record 
          what => "next" # If pattern deoesn't match, it is attached to the previous multiline record 
          charset => "ASCII" # Specify charset   
        }
    }
}
filter { #Dissect message into significant fields 
    if 'multiline' in [tags]{
        grok {
            match => { "message" => "CS9000 NFS:%{SPACE}%{GREEDYDATA} %{MONTHDAY:monthday}/%{MONTHDAY:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{GREEDYDATA}" }
    	}
    }else{
        grok {
            match => { "message" => "<%{MONTHDAY:monthday}/%{MONTHDAY:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{NOTSPACE}>%{GREEDYDATA:msg}" }
    	}
    }
     
    if 'multiline' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {# Convert format and then add the timestamp
    if '_grokparsefailure' not in  [tags]{
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]} # Create field 'date' from record info
        }
    }else{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}%{MONTHDAY:month}%{MONTHDAY:monthday}"} #extract date info from file path

	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year}"]}
        }
    }
    date {
            timezone => "${TIMEZONE}" # Apply timezone
            match => ["date","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "M d yyyy","MM d yyyy","MM dd yyyy","M dd yyyy" ,"M d yyyy H:mm:ss","MM d yyyy H:mm:ss","MM dd yyyy H:mm:ss","M dd yyyy H:mm:ss"]
            target => "@timestamp"
	    }
}

filter { # Add system and location labels
    mutate {
        add_field => {"system" => "mcs"}
        add_field => {"location" => "serialcon"}
    }
}

filter{ # Handles same timestamp records by adding correlative nanoseconds 
    ruby {
        path => "/usr/share/logstash/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/alert_script.rb"
    }
}

filter { #Agregar fingerprint como id para evitar duplicados
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","system","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {# Remove unnecesary fields
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
        }
    }

output {
    if '_dateparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true" # The output is a datastream
            data_stream_type => "logs"
            data_stream_dataset => "cp.core"
            data_stream_namespace =>"mcs" # The datstream will have the name: 'logs-iocs-mcs'
            document_id => "%{[@metadata][fingerprint]}"
        }  
    } 
}