input {
    file {
        path => ["/gemsoft/var/log/sbf/gacq/*.*"]
        mode => "tail"
        sincedb_path=> "/db/sincedb/sbf-gacq.log"
        close_older => 43200
        ignore_older => 86400
        codec => multiline {
            charset => "ASCII"
            pattern => "--------------------------------------------------------"
            negate => "false"
            what => "next"
        }
	}
}
