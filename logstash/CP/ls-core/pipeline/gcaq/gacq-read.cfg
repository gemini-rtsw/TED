input {
    file {
        path => ["/gemsoft/var/log/sbf/gacq/gacq.log.${YEAR}-${MONTH}-${DAY}*"]
        mode => "read"
        close_older => "2 m" 
        codec => multiline {
            charset => "ASCII"
            pattern => "--------------------------------------------------------"
            negate => "false"
            what => "next"
        }
	}
}
