input{
  file {
    path => '/gemsoft/var/log/serialcon/cpowtiter-ap1/gis/*/*.log'
    mode => "tail" 
    sincedb_path=> "/db/sincedb/serialcon-gis.log"
    close_older => "2 m"
    codec => plain {
      charset => "ASCII"
    }
  }
}
filter {
  grok {
   	match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:day}%{SPACE}%{TIME:time}%{SPACE}%{WORD}\)%{SPACE}%{WORD}:%{SPACE}%{WORD},%{SPACE}%{WORD}:%{SPACE}%{YEAR}/%{MONTHNUM}/%{MONTHDAY}%{SPACE}%{TIME}%{GREEDYDATA:msg}" }
    }
}

filter {
  if '_grokparsefailure' in  [tags]{
    grok{
        match => {"message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:day}%{SPACE}%{TIME:time}%{SPACE}%{WORD}\)%{SPACE}%{WORD}:%{SPACE}%{WORD},%{SPACE}%{WORD}:%{SPACE}%{GREEDYDATA:msg}"}
    }
  }
}

filter {
  grok {
    match => { "[log][file][path]" => "%{YEAR:year}" }
	}
}

filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{day} %{time}"]
      }
    }
  date {
    timezone =>"${TIMEZONE}"
    match => ["date","YYYY MMM dd HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
  mutate {
    add_field => {"subsystem" => "gis"}
    add_field => {"location" => "serialcon"}
  }
}

filter{
  ruby {
    path => "/usr/share/logstash/utils/order_handler.rb"
  }
}

filter{
    ruby {
        path => "/usr/share/logstash/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","date"]
  }
}

output {
    if '_dateparsefailure' not in [tags]{
      elasticsearch {
        hosts => "${HOST_1}"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cp.core"
        data_stream_namespace => "gis"
        document_id => "%{[@metadata][fingerprint]}"
      }
    }
}