input {
  file {
    path => "/gemsoft/var/log/cpo/tcs/tcs.log"
    mode => "tail" 
    sincedb_path => "/db/sincedb/cpo-tcs.log"
    start_position=> "beginning"
  }
}

filter {
  mutate {
    add_field => { 
      "msg" => "%{message}" 
      "system" => "tcs"
      "location" => "cpo"
    }
  }
}

filter {
  fingerprint {
    key => "key"
    method => "SHA512"
    source => ["@timestamp", "location", "system", "message"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts => "${HOST_1}"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "cp.core"
    data_stream_namespace => "tcs"
    document_id => "%{[@metadata][fingerprint]}"
  }
}

