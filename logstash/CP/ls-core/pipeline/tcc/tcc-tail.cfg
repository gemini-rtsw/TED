input {
    file { 
        path => ["/gemsoft/var/log/sbf/tcc/*/*","/gemsoft/var/log/cpo/tcc/*/*"] 
        mode => "tail" 
        sincedb_path=> "/db/sincedb/cpo-tcc.log"
        close_older => 43200
        ignore_older => 86400
        start_position => "beginning"
        codec => multiline {
            charset => "UTF-8"
            pattern => "%{DAY}%{SPACE}%{MONTH}%{SPACE}%{MONTHDAY}%{SPACE}%{TIME}"
            negate => "true"
            what => "previous"
        }
	}
}