input {
    file { 
        path => ["/gemsoft/var/log/sbf/tcc/${YEAR}_${MONTH}_${DAY}/*","/gemsoft/var/log/cpo/tcc/${YEAR}_${MONTH}_${DAY}/*"] 
        mode => "read"
        start_position => "beginning"
        codec => multiline {
            charset => "UTF-8"
            pattern => "%{DAY}%{SPACE}%{MONTH}%{SPACE}%{MONTHDAY}%{SPACE}%{TIME}"
            negate => "true"
            what => "previous"
        }
	}
}