x-logstash-common: &logstash-common
  image: ted-logstash:9.1.4
  restart: unless-stopped
  network_mode: host
  build:
    context: "."
    dockerfile: Dockerfile
    args:
      - USER=${USER}
      - UID=${U_ID}
      - GROUP=${GROUP}
      - GID=${G_ID}
  environment:
    HOST_1: "${HOST1_IP}:${ES1_HTTP_PORT}"
    TIMEZONE: "${LS_TIMEZONE}"
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 1

services:
  ls-core:
    <<: *logstash-common
    container_name: ls-core
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - ./${SITE}/ls-core/config:/usr/share/logstash/config
      - ./${SITE}/ls-core/pipeline:/usr/share/logstash/pipeline
      - ${DATA_PATH}/ls-core/db:/db
      - ${LOGS_PATH}:/gemsoft/var/
      - /etc/localtime:/etc/localtime
      - ./utils:/usr/share/logstash/utils

  ls-guiders:
    <<: *logstash-common
    container_name: ls-guiders
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - "./${SITE}/ls-guiders/config:/usr/share/logstash/config"
      - "./${SITE}/ls-guiders/pipeline:/usr/share/logstash/pipeline"
      - ${DATA_PATH}/ls-guiders/db:/db
      - ${LOGS_PATH}:/gemsoft/var/
      - /etc/localtime:/etc/localtime
      - ./utils:/usr/share/logstash/utils


  ls-opstools:
    <<: *logstash-common
    container_name: ls-opstools
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - "./${SITE}/ls-opstools/config:/usr/share/logstash/config"
      - "./${SITE}/ls-opstools/pipeline:/usr/share/logstash/pipeline"
      - ${DATA_PATH}/ls-opstools/db:/db
      - ${LOGS_PATH}:/gemsoft/var/
      - /etc/localtime:/etc/localtime
      - ./utils:/usr/share/logstash/utils
