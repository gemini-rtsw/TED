services:
  ls-core:
    image: ted-logstash:8.15.0
    hostname: logstash
    container_name: ls-core
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    build:
      context: "./logstash/${SITE}/ls-core"
      dockerfile: Dockerfile
      args:
        - USER=${USER}
        - UID=${U_ID}
        - GROUP=${GROUP}
        - GID=${G_ID}

    networks:
      - ted_network

    environment:
      HOST_IP: "${HOST01_IP}"
      HOST_1: "${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"

    volumes:
      - "./${SITE}/ls-core/config:/usr/share/logstash/config"
      - "./${SITE}/ls-core/pipeline:/usr/share/logstash/pipeline"
      - ${LOGS_PATH}:/gemsoft/var/
      - ${DATA_PATH}/ls-core/db:/db
      - /etc/localtime:/etc/localtime
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

