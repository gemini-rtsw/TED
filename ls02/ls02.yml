version: '3.7'
services:
  logstash02:
    image: ted-logstash:9.1.4
    hostname: logstash02
    container_name: ls02

    network_mode: "host"

    environment:
      LOGSTASH_MODE: read
      HOST: "http://{HOST}:9200"
      TIMEZONE: "${LS_TIMEZONE}"
      DAY: "${DAY}"
      MONTH: "${MONTH}"
      YEAR: "${YEAR}"

    volumes:
      - ./config:/usr/share/logstash/config
      - ./pipeline:/usr/share/logstash/pipeline
      - ./logs:/usr/share/logstash/logs
      - ${LOGS_PATH}:/usr/logs/log
      - ${DATA_PATH}/ls02/db:/db

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1

