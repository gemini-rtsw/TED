version: '3.7'
services:
  logstash02:
    image: ted-logstash:8.15.0
    hostname: logstash02
    container_name: ls02
    network_mode: "host"
    environment:
      LOGSTASH_MODE: read
      HOST_1: "http://${HOST01_IP}:${ES01_PORT}"
      TIMEZONE: "${LS_TIMEZONE}"
      DAY: "${DAY}"
      MONTH: "${MONTH}"
      YEAR: "${YEAR}"

    volumes:
      - ./config:/usr/share/logstash/config
      - ./pipeline:/usr/share/logstash/pipeline
      - ${LOGS_PATH}:/gemsoft/var
      - ${DATA_PATH}/ls02/db:/db

    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: 1
