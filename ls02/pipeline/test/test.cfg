input {
    file {
        # READ MODE - uncomment to load historic data (and comment TAIL MODE)
        path => "/usr/share/logstash/pipeline/test/testInput.txt"
        mode => "${LOGSTASH_MODE}" #Tail mode
        sincedb_path=> "/db/sincedb/test.log"
        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/test.log"
        close_older => "2 m" # Closes file after 2 minutes of inactivity
        start_position=> "beginning"
    }
}

output {
    stdout{}
    elasticsearch {
        hosts => "${HOST_1}"
        sniffing=> "true" 
        data_stream => "true" 
        data_stream_type => "logs"
        data_stream_dataset => "tests"
        data_stream_namespace =>"test"
    }     
}