input {
    file {
        path => ["/usr/logs/log/sbf/seqexec/*"] 
        mode => "${LOGSTASH_MODE}" 

        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/sbf-seqexec.log"
        
        sincedb_path=> "/db/sincedb/sbf-seqexec.log"
        close_older => "2 m"

        codec => multiline {
          pattern => "%{WORD}%{SPACE}\[%{WORD}"
          negate => "true"
          what => "previous"
        }
	}
}
filter {
     grok {
        match => { "message" => "%{WORD:level}%{SPACE}\[%{WORD}]%{SPACE}%{YEAR:year}-%{MONTHNUM:month}-%{MONTHDAY:monthday} %{TIME:time}: %{GREEDYDATA:msg}" }
    	}
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }else{
        mutate{
            update => {"msg" => " [%{level}] %{msg}"}
        }
    }
}

filter {
    if '_grokparsefailure' not in  [tags]{
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]} # Create field 'date' from record info
        }
    }else{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}_%{MONTHNUM:month}_%{MONTHDAY:monthday}_%{HOUR:hour}_%{MINUTE:minute}_%{SECOND:second}"} #Extract date info from file path
            add_field => {"date" => ["%{month} %{monthday} %{year} %{hour}:%{minute}:%{second}"]}
	    }
    }
    date {
        timezone =>"${TIMEZONE}"
        match => ["date","M dd yyyy","MM d yyyy","M dd yyyy","M d yyyy","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "MMM dd yyyy", "MMM d yyyy","MMM dd yyyy HH:mm:ss", "MMM d yyyy HH:mm:ss"]
        target => "@timestamp"
	}
}

filter {
    mutate {
        add_field => {"subsystem" => "seqexec"}
        add_field => {"location" => "sbf"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year","hour","minute","second","level"]
        }
    }

output {
    elasticsearch {
      hosts => "${HOST_1}"
      sniffing=> "true" 
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "sbf"
      data_stream_namespace =>"seqexec"
      document_id => "%{[@metadata][fingerprint]}"
    }   
}