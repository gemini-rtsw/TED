input {
    file {
        path => ["/usr/logs/log/sbf/qpt/qpt.${YEAR}${MONTH}${DAY}*","/usr/logs/log/sbf/qpt/qpt.20${YEAR}${MONTH}${DAY}*","/usr/logs/log/sbf/qpt/20${YEAR}${MONTH}${DAY}*"]
        mode => "${LOGSTASH_MODE}"

        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/sbf-qpt.log"

        sincedb_path=> "/db/sincedb/sbf-qpt.log"
        codec => multiline {
          pattern => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday},%{SPACE}%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD:halfday}"
          negate => "true"
          what => "previous"
        }
	}
}
filter {
     grok {
        match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday},%{SPACE}%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD:halfday} %{GREEDYDATA:msg}" }
    	}
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {
    if '_grokparsefailure' not in  [tags]{
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time} %{halfday}"]}
        }
    }else{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}%{MONTHDAY:month}%{MONTHDAY:monthday}-%{HOUR:hour}%{MINUTE:minute}%{SECOND:second}.%{GREEDYDATA:source}\.%{NOTSPACE}\."}

	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{hour}:%{minute}:%{second}"]}
        }
    }
    date {
        timezone =>"${TIMEZONE}"
        match => ["date","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "MMM dd yyyy", "MMM d yyyy","MMM dd yyyy hh:mm:ss aa", "MMM d yyyy hh:mm:ss aa","MMM dd yyyy KK:mm:ss aa", "MMM d yyyy KK:mm:ss aa"]
        target => "@timestamp"
	}
}

filter {
    mutate {
        add_field => {"subsystem" => "qpt"}
     add_field => {"location" => "sbf"}
    }
}

filter {
    if '_grokparsefailure' not in [tags]{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}%{MONTHDAY:month}%{MONTHDAY:monthday}-%{HOUR:hour}%{MINUTE:minute}%{SECOND:second}.%{GREEDYDATA:source}\.%{NOTSPACE}\." }
	    }
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year","hour","minute","second","halfday"]
        }
    }

output {
    elasticsearch {
      hosts => "${HOST_1}"
      sniffing=> "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "sbf"
      data_stream_namespace =>"qpt"
      document_id => "%{[@metadata][fingerprint]}"
    }
}
