input{
  file {    
    path => ["/usr/logs/log/flam/*.20${YEAR}-${MONTH}-${DAY}*"]
    mode => "${LOGSTASH_MODE}"
    exclude => ["edttime.log","caRepeater*"]
    sincedb_path=> "/db/sincedb/serialcon-flam2sparc.log"
    close_older => "2 m"
    start_position=> "beginning"

    }
  }
filter {
  grok {
   	match => { "message" => "%{DAY}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{WORD}%{SPACE}%{YEAR:year}%{GREEDYDATA:msg}" }
    }
}


filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{monthday} %{time}"]
      }
    }
  date {
    timezone => "${TIMEZONE}"
    match => ["date","YYYY MMM d HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"subsystem" => "flamingos-2"}
      add_field => {"location" => "serialcon"}
    
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}


filter {
    fingerprint {
        key => "key"
        method => "SHA512"
        source => ["date","location","subsystem","msg","[log][file][path]"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","monthday","time","date"]
  }
}

output {
  if '_grokparsefailure' not in [tags]{
    elasticsearch {
      hosts => "${HOST_IP}:9200"
      sniffing=> "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "serialcon"
      data_stream_namespace => "flam2sparc"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}
