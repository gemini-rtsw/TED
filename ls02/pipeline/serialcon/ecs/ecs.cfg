input{
  file {
    path => '/usr/logs/log/serialcon/cpowtiter-ap1/ecs/20${YEAR}-${MONTH}/20${YEAR}-${MONTH}-${DAY}-*.log'
    mode => "${LOGSTASH_MODE}"

    file_completed_action => 'log'
    file_completed_log_path => "/db/completed/serialcon-ecs.log"

    sincedb_path=> "/db/sincedb/serialcon-ecs.log"
    close_older => "2 m"

  }
}
filter {
  grok {
   	match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:day}%{SPACE}%{TIME:time}%{SPACE}%{WORD}\)%{SPACE}%{WORD}:%{SPACE}%{WORD},%{SPACE}%{WORD}:%{SPACE}%{GREEDYDATA:msg}" }
    }
}


filter {
  grok {
    match => { "[log][file][path]" => "%{YEAR:year}" }
	}
}

filter {
  mutate {
    add_field => {
      "log_date" => ["%{year} %{month} %{day} %{time}"]
      }
    }
  date {
    timezone => "${TIMEZONE}"
    match => ["log_date","YYYY MMM dd HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"subsystem" => "ecs"}
      add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["log_date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","log_date"]
  }
}

output {
  elasticsearch {
      hosts => "${HOST}:9200"
      sniffing=> "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "serialcon"
      data_stream_namespace => "ecs"
      document_id => "%{[@metadata][fingerprint]}"
  }
}
