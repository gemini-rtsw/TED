input{
  file {
    path => '/usr/logs/log/serialcon/cpowtiter-ap1/pwfs2/20${YEAR}-${MONTH}/20${YEAR}-${MONTH}-${DAY}-pwfs2.log'
    mode => "${LOGSTASH_MODE}"

    file_completed_action => 'log'
    file_completed_log_path => "/db/completed/serialcon-pwfs2.log"

    sincedb_path=> "/db/sincedb/serialcon-pwfs2.log"
    close_older => "1 s"
  }
}
filter {
  grok {
   	match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:day}%{SPACE}%{TIME:time}%{SPACE}%{WORD}\)%{SPACE}%{WORD}:%{SPACE}%{WORD},%{SPACE}%{WORD}:%{SPACE}%{GREEDYDATA:msg}" }
    }
}

filter {
  grok {
    match => { "[log][file][path]" => "%{YEAR:year}" }
	}
}

filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{day} %{time}"]
      }
    }
  date {
    timezone =>"${TIMEZONE}"
    match => ["date","YYYY MMM dd HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"subsystem" => "pwfs2"}
      add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","date"]
  }
}

output {
    elasticsearch {
      hosts => "${HOST_1}"
      sniffing => "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "serialcon"
      data_stream_namespace => "pwfs2"
      document_id => "%{[@metadata][fingerprint]}"
    }
}
