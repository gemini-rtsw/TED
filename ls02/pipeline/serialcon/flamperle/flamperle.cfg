input{
  file {
    exit_after_read => true
    path => "/usr/logs/log/serialcon/flamperle/20${YEAR}${MONTH}${DAY}/*"
    mode => "${LOGSTASH_MODE}"

    file_completed_action => 'log'
    file_completed_log_path => "/db/completed/serialcon-flamperle.log"

    sincedb_path=> "/db/sincedb/serialcon-flamperle.log"
    close_older => "2 m"

    codec => multiline {
        pattern => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}"
        negate => "true"
        what => "previous"
    }
  }
}
filter {
  grok {
   	match => { "message" => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD}>%{GREEDYDATA:msg}" }
    }
}


filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{day} %{time}"]
      }
    }
  date {
    timezone => "${TIMEZONE}"
    match => ["date","YYYY M d HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"subsystem" => "flamingos-2"}
      add_field => {"location" => "serialcon"}

    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","date"]
  }
}

output {
  if '_grokparsefailure' not in [tags]{
    elasticsearch {
      hosts => "${HOST_1}"
      sniffing=> "true"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "serialcon"
      data_stream_namespace => "flamingos-2"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}
