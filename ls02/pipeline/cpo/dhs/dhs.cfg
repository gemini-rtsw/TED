input {
    file {
        path => ["/usr/logs/log/cpo/dhs/cpodhs03/dhs.log-20${ENVYEAR}${ENVMONTH}${ENVDAY}","/usr/logs/log/cpo/dhs/cpodhs04/dhs.log-20${ENVYEAR}${EMVMONTH}${ENVDAY}"]
        mode => "${LOGSTASH_MODE}"
        exit_after_read => true
        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/cpo-dhs.log"

        sincedb_path=> "/db/sincedb/cpo-dhs.log"
        close_older => "2 m"

        codec => plain {
            charset => "ASCII"
        }
	}
}
filter {
     grok {
        match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{WORD:client}%{SPACE}%{GREEDYDATA:msg}" }
    	}
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {
    if '_grokparsefailure' not in  [tags]{
        grok {
            match => { "[log][file][path]" => "%{URIPATH}/%{WORD}.%{WORD}-%{YEAR:year}"}
	    }
        if "%{year}" {
            mutate {
                add_field => {"date" => ["%{month} %{monthday} %{+YYYY} %{time}"]}
            }
        }else{
            mutate{
                add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
                }
            }
    }else{
        grok {
            match => { "[log][file][path]" => "%{URIPATH}/%{WORD}.%{WORD}-%{YEAR:year}%{MONTHDAY:month}%{MONTHDAY:monthday}"}
	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year}"]}
        }
        }
    date {
            timezone =>'America/Santiago'
            match => ["date","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "MMM dd yyyy", "MMM d yyyy","MMM dd yyyy HH:mm:ss", "MMM d yyyy HH:mm:ss"]
            target => "@timestamp"
	    }
}

filter {
    mutate {
        add_field => {"subsystem" => ["dhs"]}
        add_field => {"location" => ["cpo"] }
    }
}

filter {
    if ("cpodhs03" in [client]){
        mutate{
            update=> {"client"=> "instrument(cpodhs03)"}
        }
    }else{
        mutate{
            update=> {"client"=> "wave_front_sensor(cpodhs04)"}
        }
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg","client"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}


filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
        }
    }


output {
    elasticsearch {
        hosts => ["${HOST_1}"]
        sniffing=> "true"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cpo"
        data_stream_namespace =>"dhs"
        document_id => "%{[@metadata][fingerprint]}"
    }
}
