input {
    file {
        path => ["/usr/logs/log/cpo/gacq/gacq.log.20${YEAR}-${MONTH}-${DAY}*"]
        mode => "${LOGSTASH_MODE}"

        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/cpo-gacq.log"

        sincedb_path=> "/db/sincedb/cpo-gacq.log"
        close_older => "2 m"

        codec => multiline {
            charset => "ASCII"
            pattern => "--------------------------------------------------------"
            negate => "false"
            what => "next"
        }
	}
}
filter {
     grok {
        match => { "message" => "^%{TIMESTAMP_ISO8601:date}%{SPACE}%{GREEDYDATA:msg}" }
    	}
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {
    if '_grokparsefailure' in  [tags]{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}-%{MONTHDAY:month}-%{MONTHDAY:monthday}"}

	    }
        mutate {
            add_field => {"date" => ["%{month}-%{monthday}-%{year}"]}
        }
    }
    date {
            timezone =>"${TIMEZONE}"
            match => ["date","M-d-yyyy HH:mm:ss","MM-d-yyyy HH:mm:ss","MM-dd-yyyy HH:mm:ss","M-dd-yyyy HH:mm:ss", "MMM-dd-yyyy", "MMM-d-yyyy","YYYY-MM-dd HH:mm:ss","M-d-yyyy","MM-d-yyyy"]
            target => "@timestamp"
	    }
}

filter {
    mutate {
        add_field => {"subsystem" => "gacq"}
        add_field => {"location" => "cpo"}
    }
}

filter {
    grok {
        match => { "[log][file][path]" => "%{YEAR}-%{MONTHDAY}-%{MONTHDAY}.%{GREEDYDATA:source}" }
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
        }
    }


output {
    elasticsearch {
        hosts => "${HOST_IP}:9200"
        sniffing=> "true"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cpo"
        data_stream_namespace =>"gacq"
        document_id => "%{[@metadata][fingerprint]}"
    }
}
