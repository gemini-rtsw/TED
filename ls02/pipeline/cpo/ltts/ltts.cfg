input{
    file{
        exit_after_read => true
        path => "/usr/logs/log/cpo/ltts/ltts.production.south.log*"
        mode => "${LOGSTASH_MODE}"

        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/cpo-ltts.log"

        sincedb_path=> "/db/sincedb/cpo-ltts.log"
        close_older => "2 m"

        codec => multiline {
            pattern => "%{WORD}%{SPACE}\[%{NOTSPACE}\]%{SPACE}%{YEAR}-%{MONTHNUM}-%{MONTHDAY}%{SPACE}%{TIME}"
            negate => "true"
            what => "previous"
        }
    }
}

filter{
    grok{
        match => {"message" => "%{WORD:level}%{SPACE}\[%{NOTSPACE:task}\]%{SPACE}%{YEAR:year}-%{MONTHDAY:month}-%{MONTHDAY:monthday}%{SPACE}%{TIME:time}:%{SPACE}%{GREEDYDATA:msg}"}
    }
}

filter{
    if '_grokparsefailure' not in [tags]{
        mutate{
            add_field => {"date" => ["%{year} %{month} %{monthday} %{time}"]}
        }
    }
    date{
        timezone =>"${TIMEZONE}"
        match => ["date","YYYY MM dd HH:mm:ss,SSS","YYYY MM d HH:mm:ss,SSS","YYYY M dd HH:mm:ss,SSS","YYYY M d HH:mm:ss,SSS"]
        target => "@timestamp"
    }
}

filter{
    mutate{
        add_field => {"subsystem" => "ltts"}
        add_field => {"location" => "cpo"}
        update => {"msg"=> "[%{level}] %{msg}" }
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","host","message","date","month","monthday","year","time","level"]
    }
}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            sniffing=> "true"
            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "cpo"
            data_stream_namespace => "ltts"
            document_id => "%{[@metadata][fingerprint]}"
        }
    }
}
