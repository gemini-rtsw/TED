input {
    file { 
        path => ["/usr/logs/log/cpo/gea/error_log"] 
        mode => "${LOGSTASH_MODE}" 

        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/cpo-gea-error.log" 
        
        sincedb_path=> "/db/sincedb/cpo-gea-error.log"
        close_older => "2 m" 

        codec => multiline { 
            charset => "ASCII"
            pattern => "\[%{DAY}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}"
            negate => "true" 
            what => "previous" 
        }
	}
}
filter { 
     grok {
        match => { "message" => "\[%{DAY}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{YEAR:year}\]%{SPACE}%{GREEDYDATA:msg}" }
    	}
}

filter {
    if '_grokparsefailure' not in [tags]{
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
        }
    }
    date {
        timezone =>"${TIMEZONE}"
        match => ["date","MMM dd yyyy HH:mm:ss.SSSSSSSSS", "MMM d yyyy HH:mm:ss.SSSSSSSSS","MMM dd yyyy HH:mm:ss", "MMM d yyyy HH:mm:ss" ] #0:51:03.363830
        target => "@timestamp"
	}
}

filter { #Add subsystem and location labels
    mutate {
        add_field => {"subsystem" => "gea"}
        add_field => {"location" => "cpo"}
    }
}


filter{ # Handles same timestamp records by adding correlative nanoseconds 
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter { #Agregar fingerprint como id para evitar duplicados
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
    }
}

output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            sniffing=> "true" # Sniff the network if explicit nodes are not available
            data_stream => "true" # The output is a datastream
            data_stream_type => "logs"
            data_stream_dataset => "cpo"
            data_stream_namespace =>"gea-error" # The datstream will have the name: 'logs-apps-cpo-seqexec-ng
            document_id => "%{[@metadata][fingerprint]}"
        } 
    }  
}