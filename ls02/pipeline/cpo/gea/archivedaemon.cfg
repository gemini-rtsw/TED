input {
    file {
        path => ["/usr/logs/log/cpo/gea/engines/ArchiveDaemon.log"]
        mode => "${LOGSTASH_MODE}"

        file_completed_action => 'log'
        file_completed_log_path => "/db/completed/cpo-gea-archivedaemon.log" 
        
        sincedb_path=> "/db/sincedb/cpo-gea-archivedaemon.log"
        close_older => "2 m" 

        codec => multiline { 
            charset => "ASCII" 
            pattern => "%{YEAR:year}/%{MONTHDAY:month}/%{MONTHDAY:monthday}%{SPACE}%{TIME:time}" 
            negate => "true" 
            what => "previous"
        }
	}
}
filter {
     grok {
        match => { "message" => "%{YEAR:year}/%{MONTHDAY:month}/%{MONTHDAY:monthday}%{SPACE}%{TIME:time}:%{SPACE}%{GREEDYDATA:msg}" } #matches incoming line with the grok pattern
    }
}

filter { 
    if '_grokparsefailure' not in [tags]{ 
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]} 

        }
    }
    date {
            timezone => "${TIMEZONE}"
            match => ["date","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "MMM dd yyyy", "MMM d yyyy","YYYY MM dd HH:mm:ss","M d yyyy","MM d-yyyy"]
            target => "@timestamp"
	}
}

filter { 
    mutate {
        add_field => {"subsystem" => "gea"}
        add_field => {"location" => "cpo"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter { 
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}


filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
        }
    }


output {
    if '_grokparsefailure' not in [tags]{
        elasticsearch {
        hosts => "${HOST_1}" 
        sniffing=> "true" 
        data_stream => "true" 
        data_stream_type => "logs"
        data_stream_dataset => "cpo"
        data_stream_namespace =>"gea-archivedaemon" 
        document_id => "%{[@metadata][fingerprint]}"
        } 
    }  
}