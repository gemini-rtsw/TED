status = error
name = LogstashPropertiesConfig

appender.console.type = Console
appender.console.name = plain_console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{ISO8601}][%-5p][%-25c]%notEmpty{[%X{pipeline.id}]}%notEmpty{[%X{plugin.id}]} %m%n

appender.json_console.type = Console
appender.json_console.name = json_console
appender.json_console.layout.type = JSONLayout
appender.json_console.layout.compact = true
appender.json_console.layout.eventEol = true


rootLogger.level = ERROR
rootLogger.appenderRef.console.ref = ${sys:ls.log.format}_console



appender.file_logstash_javapipeline.type = RollingFile
appender.file_logstash_javapipeline.name = file_logstash_javapipeline
appender.file_logstash_javapipeline.fileName = logs/logstash_javapipeline.log
appender.file_logstash_javapipeline.filePattern = logs/logstash_javapipeline-%d{yyyy-MM-dd}-%i.log.gz
appender.file_logstash_javapipeline.layout.type = PatternLayout
appender.file_logstash_javapipeline.layout.pattern = [%d{ISO8601}][%-5p][%-25c] %m%n
appender.file_logstash_javapipeline.policies.type = Policies
appender.file_logstash_javapipeline.policies.size.type = SizeBasedTriggeringPolicy
appender.file_logstash_javapipeline.policies.size.size = 100MB
appender.file_logstash_javapipeline.strategy.type = DefaultRolloverStrategy
appender.file_logstash_javapipeline.strategy.max = 30


logger.logstash_javapipeline.name = logstash.javapipeline
logger.logstash_javapipeline.level = INFO
logger.logstash_javapipeline.appenderRef.file_logstash_javapipeline.ref = file_logstash_javapipeline
logger.logstash_javapipeline.additivity = false
