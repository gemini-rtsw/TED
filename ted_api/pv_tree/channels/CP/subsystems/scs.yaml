SCS:
  Tilt & Focus:
    Applied Guide:
      X Tilt:
        codes:
          - m2:displayScs.VALA
      Y Tilt:
        codes:
          - m2:displayScs.VALB
      Z Focus:
        codes:
          - m2:displayScs2.VALB
    Demand:
      X Tilt:
        codes:
          - m2:displayScs2.VALF
      Y Tilt:
        codes:
          - m2:displayScs2.VALG
      Z Focus:
        codes:
          - m2:displayScs.VALC
    Actual:
      X Tilt:
        codes:
          - m2:real.VALC
      Y Tilt:
        codes:
          - m2:real.VALD
      Z Focus:
        codes:
          - m2:real.VALE
    Error:
      X Tilt:
        codes:
          - m2:xTiltErr
      Y Tilt:
        codes:
          - m2:yTiltErr
      Z Focus:
        codes:
          - m2:zErr
  Guide:
    Raw Guide:
      X:
        codes:
          - m2:displayScs2.VALC
      Y:
        codes:
          - m2:displayScs2.VALD
      Z:
        codes:
          - m2:displayScs2.VALE
    Windup:
      X:
        codes:
          - m2:xWindup
      Y:
        codes:
          - m2:yWindup
      Z:
        codes:
          - m2:zWindup
    Guide Status:
      codes: 
        - m2:guideOn

  Positions:
    Demand:
      X positioner:
        codes:
          - m2:xPosDmd
      Y positioner:
        codes:
          - m2:yPosDmd
    Actual:
      X positioner:
        codes:
          - m2:xPos
      Y positioner:
        codes:
          - m2:yPos
    Error:
      X positioner:
        codes:
          - m2:xPosErr
      Y positioner:
        codes:
          - m2:yPosErr
    Real:
      X positioner:
        codes:
          - m2:real.VALN
      Y positioner:
        codes:
          - m2:real.VALO
    Display:
      X positioner:
        codes:
          - m2:displayScs.VALN
      Y positioner:
        codes:
          - m2:displayScs.VALO
  Status:
    Mirror control:
      codes:
        - m2:byte3:b6
    Vibration Loop:
      codes:
        - m2:byte0:b6
    Offloader:
      codes:
        - m2:byte3:b7
    Actuator Power:
      codes:
        - m2:byte0:b2
    CEM temperature:
      codes:
        - m2:status.VALE
    Chop Frequency:
      codes:
        - m2:displayScs.VALS
    Chop ON/OFF:
      codes:
        - m2:chopon
    Follow ON/OFF:
      codes:
        - m2:followS
  Position Sensors:
    Kaman:
      codes:
        - m2:act1Diag.VALD
        - m2:act2Diag.VALD
        - m2:act3Diag.VALD
    uE:
      codes:
        - m2:act1Diag.VALA
        - m2:act2Diag.VALA
        - m2:act3Diag.VALA
    Kaman and uE:
      codes:
        - m2:act1Diag.VALA
        - m2:act1Diag.VALD
        - m2:act2Diag.VALA
        - m2:act2Diag.VALD
        - m2:act3Diag.VALA
        - m2:act3Diag.VALD
    Current:
      codes:
        - m2:act1Diag.VALC
        - m2:act2Diag.VALC
        - m2:act3Diag.VALC
    Position Drift:
      codes:
        - m2:posDrift0
        - m2:posDrift1
        - m2:posDrift2
    Follower positions:
      codes:
        - m2:act1Diag.VALB
        - m2:act2Diag.VALB
        - m2:act3Diag.VALB
  Focus:
    codes:
      - m2:real.VALE
  Baffle Status:
    Deploy/Demand:
      codes:
        - m2:showDeploy
    Deploy/Actual:
      codes:
        - m2:DeployBafflePos
    Central/Demand:
      codes:
        - m2:showCentral
    Central/Actual:
      codes:
        - m2:CentralBafflePos
    Encoder A:
      codes:
        - m2:real.VALR
    Encoder B:
      codes:
        - m2:real.VALS
    Encoder C:
      codes:
        - m2:real.VALT

  StatusWords:
    Byte 0 and 3:
      codes:
        - m2:byte0:b2
        - m2:byte0:b6
        - m2:byte0:b7
        - m2:byte3:b1
        - m2:byte3:b2
        - m2:byte3:b6
        - m2:byte3:b7
    B0:b2:
      codes:
        - m2:byte0:b2
    B0:b6:
      codes:
        - m2:byte0:b6
    B0:b7:
      codes:
        - m2:byte0:b7
    B2:b6:
      codes:
        - m2:byte2:b6
    B2:b7:
      codes:
        - m2:byte2:b7
    B3:b1:
      codes:
        - m2:byte3:b1
    B3:b2:
      codes:
        - m2:byte3:b2
    B3:b6:
      codes:
        - m2:byte3:b6
    B3:b7:
      codes:
        - m2:byte3:b7

  Other:
    Last Frame Sent:
      codes:
        - m2:real.VALU
    Last Frame Acknowledged:
      codes:
        - m2:real.VALB
    SCS Heartbeat:
      codes:
        - m2:displayScs.VALM
    M2 Heartbeat:
      codes:
        - m2:real.VALL
    ring:
      codes:
        - m2:refmem:ring
    beam:
      codes:
        - m2:beam


