      codes:
        - gm:cc:mskRelPower
        - gm:cc:mskGrpPower
        - gm:cc:mskCasPower
        - gm:cc:mskExtPower
    Probe Power:
      codes:
        - gm:wfs:probeBasPower
        - gm:wfs:probePkoPower
    DTA Power:
      X:
        codes:
          - gm:cc:dta1Power
          - gm:cc:dta1Device.PWR
      Y:
        codes:
          - gm:cc:dta2Device.PWR
          - gm:cc:dta2Power
      Z:
        codes:
          - gm:cc:dta3Device.PWR
          - gm:cc:dta3Power
