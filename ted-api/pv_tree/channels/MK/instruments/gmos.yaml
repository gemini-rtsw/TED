        - gm:cc:downstreamOk
    Control:
      codes:
        - gm:cc:masterDisabled
        - gm:cc:softIlock
        - gm:cc:ilock
  Doors:
    codes:
      - gm:cc:door1
      - gm:cc:door2
      - gm:cc:door3
      - gm:cc:door4
      - gm:cc:door5
      - gm:cc:door6
      - gm:cc:door7
      - gm:cc:door8
      - gm:cc:doorIlckDefeat
  Motor and Power:
