apiVersion: 1

contactPoints:
    - orgId: 1
      name: grafana-default-email
      receivers:
        - uid: fesr7afzpjgn4c
          type: email
          settings:
            addresses: oscar.fuentes@noirlab.edu
            message: 'value: {{ $$values.A.Value }}'
            singleEmail: false
          disableResolveMessage: false
policies:
    - orgId: 1
      receiver: grafana-default-email
      group_by:
        - grafana_folder
      group_wait: 30s
      group_interval: 10s
      repeat_interval: 10s

