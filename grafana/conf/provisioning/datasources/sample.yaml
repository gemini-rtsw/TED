    typeLogoUrl: public/plugins/marcusolsson-json-datasource/img/logo.svg
    access: proxy
    url: http://aaservice:8000
    user: ''
    database: ''
    basicAuth: false
    isDefault: false
    jsonData: {}
    readOnly: false

  - id: 5
    uid: cesb7dv10h3i8b
    orgId: 1
    name: ArchiverAppliance
    type: sasaki77-archiverappliance-datasource
    typeName: ArchiverAppliance
    typeLogoUrl: public/plugins/sasaki77-archiverappliance-datasource/img/EPICS_Logo.png
