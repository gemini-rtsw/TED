# Configuration file version
apiVersion: 1

# # List of data sources to insert/update depending on what's
# # available in the database.
datasources:
  - id: 1
    uid: F1zgMdwVz
    orgId: 1
    name: Elasticsearch
    type: elasticsearch
    typeName: Elasticsearch
    typeLogoUrl: public/app/plugins/datasource/elasticsearch/img/elasticsearch.svg
    access: proxy
    url: http://es01:9200
    user: ''
    database: logs-*
    basicAuth: false
    isDefault: true
    jsonData:
      esVersion: 8.0.0
      global_queries: []
      includeFrozen: false
      logLevelField: ''
      logMessageField: msg
      maxConcurrentShardRequests: 5
      timeField: "@timestamp"
      timeInterval: 1s
    readOnly: false
    
  - id: 2
    uid: X9mrkFjVk
    orgId: 1
    name: Elasticsearch API
    type: marcusolsson-json-datasource
    typeName: JSON API
    typeLogoUrl: public/plugins/marcusolsson-json-datasource/img/logo.svg
    access: proxy
    url: http://es01:9200/
    user: ''
    database: ''
    basicAuth: false
    isDefault: false
    jsonData: {}
    readOnly: false

  - id: 3
    uid: Cgf7JOwVz
    orgId: 1
    name: GEA API
    type: marcusolsson-json-datasource
    typeName: JSON API
    typeLogoUrl: public/plugins/marcusolsson-json-datasource/img/logo.svg
    access: proxy
    url: http://geaservice:8000
    user: ''
    database: ''
    basicAuth: false
    isDefault: false
    jsonData:
      esVersion: 8.0.0
      includeFrozen: false
      logLevelField: ''
      logMessageField: ''
      maxConcurrentShardRequests: 5
      timeField: "@timestamp"
