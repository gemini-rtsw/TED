- pipeline.id: mk-gws-${LOGSTASH_MODE}
  pipeline.workers: 1
  path.config: "/usr/share/logstash/pipeline/mk/gws/gws.cfg"
  queue.type: persisted
  queue.max_bytes: 100mb

- pipeline.id: mk-pr-${LOGSTASH_MODE}
  pipeline.workers: 1
  path.config: "/usr/share/logstash/pipeline/mk/pr/pr.cfg"
  queue.type: persisted
  queue.max_bytes: 100mb
