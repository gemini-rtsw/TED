input {
    file {
        path => ["/usr/logs/log/cpo/gea/watcher.log"]
        mode => "${LOGSTASH_MODE}"
        
        sincedb_path=> "/db/sincedb/cpo-gea-watcher.log"
        close_older => "2 m" 

        codec => multiline {
            pattern => "%{MONTHDAY}/"
            negate => "true"
            what => "previous"
        }
	}
}
filter { 
    grok {
        match => { "message" => ["%{MONTHDAY:month}/%{MONTHDAY:monthday}/%{YEAR:year}/%{NUMBER}/%{NUMBER}%{SPACE}%{TIME:time}%{SPACE}%{GREEDYDATA:msg}","^%{MONTHDAY:month}/%{MONTHDAY:monthday}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{GREEDYDATA:msg}"] }
    }
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {
    if '_grokparsefailure' not in [tags]{
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
        }
    }
    date {
        timezone =>"${TIMEZONE}"
        match => ["date","M d yy HH:mm:ss","MM d yy HH:mm:ss","MM dd yy HH:mm:ss","M dd yy HH:mm:ss", "MMM dd yy", "MMM d yy","YYYY MM dd HH:mm:ss","M d yy","MM d yy"]
        target => "@timestamp"
	}
}

filter {
    mutate {
        add_field => {"subsystem" => "gea"}
        add_field => {"location" => "cpo"}
    }
}


filter{ 
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
    }
}


output {
    if "_grokparsefailure" not in [tags]{
        elasticsearch {
            hosts => "${HOST_1}"
            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "cpo"
            data_stream_namespace =>"gea-watcher"
            document_id => "%{[@metadata][fingerprint]}"
        }  
    }
}