input {
    file { 
        path => ["/usr/logs/log/cpo/tcc/*/*.*"] 
        mode => "${LOGSTASH_MODE}" 

        sincedb_path=> "/db/sincedb/cpo-tcc.log"
        close_older => "2 m"

        codec => multiline {
            charset => "UTF-8"
            pattern => "%{DAY}%{SPACE}%{MONTH}%{SPACE}%{MONTHDAY}%{SPACE}%{TIME}"
            negate => "true"
            what => "previous"
        }
	}
}
filter {
    grok {
        match => { "message" => "%{DAY:day}%{SPACE}%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{NOTSPACE}%{SPACE}%{YEAR:year}%{SPACE}%{GREEDYDATA:msg}" }
    	}
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {
    if '_grokparsefailure' not in  [tags]{
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
        }
    }else{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}_%{MONTHNUM:month}_%{MONTHDAY:monthday}"}

	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year}"]}
        }
    }
    date {
            timezone => "${TIMEZONE}"
            match => ["date","M dd yyyy","MM d yyyy","M dd yyyy","M d yyyy","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "MMM dd yyyy", "MMM d yyyy","MMM dd yyyy HH:mm:ss", "MMM d yyyy HH:mm:ss"]
            target => "@timestamp"
	}
}

filter {
       mutate {
        add_field => {"subsystem" => "tcc"}
        add_field => {"location" => "cpo"}
        }
}

filter {
    if '_grokparsefailure' not in [tags]{
        grok {
            match => { "[log][file][path]" => "%{PATH}/%{WORD:org}\." }
	    }
        mutate {
            split => { "org" => "_" }
            add_field => { "source" => "%{[org][1]}" }
            }
    }else {
        mutate {
            add_field => { "source" => "%{[log][file][path]}" }
        }  
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter { 
    mutate {
        remove_field => ["@version","date","host","message","month","day","time","monthday","year","org","sour"]
        }
    }


output {
    elasticsearch {
        hosts => "${HOST_1}"
        sniffing=> "true" 
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cpo"
        data_stream_namespace =>"tcc"
        document_id => "%{[@metadata][fingerprint]}"
    }   
}