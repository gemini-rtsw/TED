input {
    file {
        path => "/usr/logs/log/cpo/casnooper/*" 
        mode => "${LOGSTASH_MODE}"
        sincedb_path=> "/db/sincedb/cpo-casnooper.log"
        close_older => "2 m"
        start_position=> "beginning"
        codec => multiline {
            pattern => "^---"
            negate => "true"
            what => "previous"
            max_lines => "100000"
            max_bytes => "100 MiB"
        }
    }
}

filter { 
    grok {
        match => { "message" => ["%{YEAR:year}%{MONTHNUM2:month}%{MONTHDAY:monthday}T%{HOUR:hour}%{MINUTE:minute}%{SECOND:second}%{GREEDYDATA:commands}%{SPACE}-------------------------\n%{GREEDYDATA:msg}"] }
    }
    if '_grokparsefailure' in [tags] {
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}%{MONTHNUM2:month}%{MONTHDAY:monthday}" }
            add_field => { "msg" => "%{[event][original]}" }
        }
	grok{
           match => { "message" => "%{TIME:time}" }
	}
    }

    if '_grokparsefailure' not in [tags] {
        mutate {
            add_field => { "date" => "%{month} %{monthday} %{year} %{hour}:%{minute}:%{second}" }
        }
    } else {
        mutate {
	    remove_tag => [ "_grokparsefailure" ]
            add_field => { "date" => "%{month} %{monthday} %{year} %{time}" }
        }
    }
    date {
        timezone => "${TIMEZONE}"
        match => ["date", "MM dd yyyy HH:mm:ss","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss", "M dd yyyy HH:mm:ss"]
        target => "@timestamp"
    }
}

filter {
    mutate {
        add_field => { "subsystem" => "casnooper" }
        add_field => { "location" => "cpo" }
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date", "location", "subsystem", "msg", "commands"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version", "date", "host", "message", "month", "time", "monthday", "year", "hour", "minute", "second"]
    }
}

output {
    elasticsearch {
        hosts => "${HOST_1}"
        sniffing => "true"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "cpo"
        data_stream_namespace => "casnooper"
        document_id => "%{[@metadata][fingerprint]}"
    }
}

