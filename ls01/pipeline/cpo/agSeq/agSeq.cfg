input {
  file {
    path => "/usr/logs/log/cpo/agSeq/agSeq.log"
    mode => "${LOGSTASH_MODE}" 
    sincedb_path => "/db/sincedb/cpo-agSeq.log"
    close_older => "2 m"
    start_position=> "beginning"
  }
}

filter {
  mutate {
    add_field => { 
      "msg" => "%{message}" 
      "subsystem" => "agSeq"
      "location" => "cpo"
    }
  }
}

filter {
  fingerprint {
    key => "key"
    method => "SHA512"
    source => ["@timestamp", "location", "subsystem", "message"]
    target => "[@metadata][fingerprint]"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts => "${HOST_IP}:9200"
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "cpo"
    data_stream_namespace => "agSeq"
    document_id => "%{[@metadata][fingerprint]}"
  }
}

