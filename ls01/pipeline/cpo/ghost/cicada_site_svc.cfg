input {
    file {
        path => "/usr/logs/log/ghost/cicada/cicada_site_svc.log*" # Path of input file
        mode => "${LOGSTASH_MODE}"
        sincedb_path=> "/db/sincedb/cpo-ghost-cicada_site_svc.log"
        #close_older=> "2 m"
        start_position=> "beginning"
        codec => multiline { # Identifies multiline log
          pattern =>"%{YEAR:year}-%{MONTHNUM2:month}-%{MONTHDAY:monthday}" #Grok pattern to identify
          negate => "true" #If pattern is found it can be a multiline header or a single line record 
          what => "previous" # If pattern deoesn't match, it is attached to the previous multiline record 
          }
        }
}
filter { #Dissect message into significant fields 
     grok {
        match => { "message" => ["%{YEAR:year}-%{MONTHNUM2:month}-%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{LOGLEVEL:loglevel}%{SPACE}%{USERNAME:source}%{SPACE}-%{SPACE}%{GREEDYDATA:msg}","%{YEAR:year}-%{MONTHNUM2:month}-%{MONTHDAY:monthday}%{SPACE}T%{TIME:time}%{SPACE}%{GREEDYDATA:msg}","%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{GREEDYDATA:msg}"] }
    	}
    if '_grokparsefailure' in [tags]{ # If there's a failure trying to match the pattern
        mutate{
            add_field => {"msg" => "%{[event][original]}"} # Add the whole event to the msg field
        }
    }
}

filter { # Convert format and then add the timestamp
    if '_grokparsefailure' not in  [tags]{
        mutate {
            add_field => {"date" => "%{year}-%{month}-%{monthday} %{time}"} # Create field 'date' from record info
        }

    	date {
        	timezone =>"${TIMEZONE}" #Apply timezone
           	match => ["date","YYYY-MM-dd","YYYY-MM-dd HH:mm:ss,SSS","YYYY-M-dd HH:mm:ss,SSS","YYYY-MM-dd HH:mm:ss.SSS","YYYY-M-dd HH:mm:ss.SSS"] 
            	target => "@timestamp"  
	    }
	}
}

filter {  # Add subsystem and location labels
  mutate {
        add_field => {"subsystem" => "ghost"}
        add_field => {"location" => "cpo"}
    }
}


filter{ # Handles same timestamp records by adding correlative nanoseconds 
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

filter { # Add fingerprint to avoid duplication
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg","source"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","time","year","monthday","month"]
        }
    }

output {
    elasticsearch {
      hosts => "${HOST_IP}:9200" # Array with all the available elasticsearch nodes
      data_stream => "true" # The output is a datastream
      data_stream_type => "logs"
      data_stream_dataset => "cpo"
      data_stream_namespace =>"ghost-cicada"
      document_id => "%{[@metadata][fingerprint]}"
    }   
}
