input {
    file {
        path => ["/usr/logs/log/serialcon/cpo-bto-perle/*.*"]
        mode => "${LOGSTASH_MODE}"

        sincedb_path=> "/db/sincedb/serialcon-bto.log"
        close_older => "2 m"

        start_position=> "beginning"

        codec => multiline {
          pattern => "CS9000 NFS:"
          negate => "false"
          what => "next"
          charset => "ASCII"    
        }
    }
}
filter {
    if 'multiline' in [tags]{
        grok {
            match => { "message" => "CS9000 NFS:%{SPACE}%{GREEDYDATA} %{MONTHDAY:monthday}/%{MONTHDAY:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{GREEDYDATA}" }
    	}
    }else{
        grok {
            match => { "message" => ["^<%{MONTHDAY:monthday}/%{MONTHDAY:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{NOTSPACE}>%{GREEDYDATA:msg}","%{NOTSPACE}%{SPACE}%{MONTHDAY:month}/%{MONTHDAY:monthday}/%{YEAR:year}%{SPACE}%{TIME:time}:%{SPACE}%{GREEDYDATA:msg}","%{YEAR:year}%{MONTHDAY:month}%{MONTHDAY:monthday}"] }
    	}
    }
     
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {
    if '_grokparsefailure' not in  [tags]{
            if "%{time}"{
            mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
            }
        }else{
             mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year}"]}
            }
        }
    }else{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}%{MONTHDAY:month}%{MONTHDAY:monthday}"}

	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year}"]}
        }
    }
    date {
            timezone =>"${TIMEZONE}"
            match => ["date","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "M d yyyy","MM d yyyy","MM dd yyyy","M dd yyyy" ]
            target => "@timestamp"
	}
}

filter {
    mutate {
        add_field => {"subsystem" => "bto"}
        add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["date","host","message","month","time","monthday","year"]
    }
}


output {
    if '_dateparsefailure' not in [tags]{
        elasticsearch {
            hosts => "${HOST_IP}:9200"
            data_stream => "true"
            data_stream_type => "logs"
            data_stream_dataset => "serialcon"
            data_stream_namespace =>"bto"
            document_id => "%{[@metadata][fingerprint]}"
        }
    }   
}