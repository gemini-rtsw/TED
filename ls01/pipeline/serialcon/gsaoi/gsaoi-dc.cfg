input{
  file {
    path => '/usr/logs/log/serialcon/gsaoi-perle/gsaoi-dc.dat'
    mode => "${LOGSTASH_MODE}"

    sincedb_path=> "/db/sincedb/serialcon-gsaoi-dc.log"
    close_older => "2 m"

    start_position=> "beginning"

  }
}
filter {
  grok {
   	match => { "message" => "<%{MONTHDAY:day}/%{NUMBER:month}/%{YEAR:year}%{SPACE}%{TIME:time}%{SPACE}%{WORD}>%{GREEDYDATA:msg}" }
    }
}


filter {
  mutate {
    add_field => {
      "date" => ["%{year} %{month} %{day} %{time}"]
      }
    }
  date {
    timezone =>"${TIMEZONE}"
    match => ["date","YYYY M d HH:mm:ss"]
    target => "@timestamp"
  }
}

filter {
    mutate {
      add_field => {"subsystem" => "gsaoi-dc"}
      add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
  mutate {
    remove_field => ["@version","host","message","year","month","day","time","date"]
  }
}

output {
  if '_grokparsefailure' not in [tags]{
    elasticsearch {
        hosts => "${HOST_1}"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "serialcon"
        data_stream_namespace => "gsaoi-dc"
        document_id => "%{[@metadata][fingerprint]}"
    }
  }
}