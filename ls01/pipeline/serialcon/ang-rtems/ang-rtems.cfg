input {
    file {
        path => "/usr/logs/log/serialcon/ang_rtems/*/*.*"
        mode => "${LOGSTASH_MODE}"

        sincedb_path=> "/db/sincedb/serialcon-ang-rtems.log"
        close_older => "2 m"

	}
}
filter {
     grok {
        match => { "message" => "%{MONTH:month}%{SPACE}%{MONTHDAY:monthday}%{SPACE}%{TIME:time}%{SPACE}%{NOTSPACE}%{SPACE}%{NOTSPACE}%{SPACE}%{NOTSPACE} %{GREEDYDATA:msg}" }
    	}
    if '_grokparsefailure' in [tags]{
        mutate{
            add_field => {"msg" => "%{[event][original]}"}
        }
    }
}

filter {
    if '_grokparsefailure' not in  [tags]{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}"}

	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year} %{time}"]}
        }
    }else{
        grok {
            match => { "[log][file][path]" => "%{YEAR:year}-%{MONTHNUM:month}-%{MONTHDAY:monthday}"}

	    }
        mutate {
            add_field => {"date" => ["%{month} %{monthday} %{year}"]}
        }
    }
    date {
        timezone =>"${TIMEZONE}"
        match => ["date","M d yyyy HH:mm:ss","MM d yyyy HH:mm:ss","MM dd yyyy HH:mm:ss","M dd yyyy HH:mm:ss", "MMM dd yyyy", "MMM d yyyy","MMM dd yyyy HH:mm:ss", "MMM d yyyy HH:mm:ss"]
        target => "@timestamp"
	}
}

filter {
    mutate {
        add_field => {"subsystem" => "ang-rtems"}
        add_field => {"location" => "serialcon"}
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/order_handler.rb"
    }
}

filter{
    ruby {
        path => "/usr/share/logstash/pipeline/utils/alert_script.rb"
    }
}

filter {
    fingerprint {
        key => "key"
        method => "SHA256"
        source => ["date","location","subsystem","msg"]
        target => "[@metadata][fingerprint]"
        concatenate_sources => true
    }
}

filter {
    mutate {
        remove_field => ["@version","date","host","message","month","time","monthday","year"]
    }
}


output {
    elasticsearch {
      hosts => "${HOST_1}"
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "serialcon"
      data_stream_namespace =>"ang-rtems"
      document_id => "%{[@metadata][fingerprint]}"
    }   
}